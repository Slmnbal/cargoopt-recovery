name: PH2-T03 exact lock resolver

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve:
    name: Ephemeral exact dependency candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install exact uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          python-version: "3.14.7"
          enable-cache: false

      - name: Configure isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          printf 'UV_CACHE_DIR=%s/uv-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/candidate"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate"

      - name: Verify baseline and exact toolchain
        shell: bash
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          test "$(uv --version | awk '{print $2}')" = "0.12.3"
          test "$(sha256sum pyproject.toml | awk '{print $1}')" = \
            "db02c0b9ea47e128a595682da17c9176dac55b9052e900d5dc67084076bc9b6b"
          test "$(sha256sum uv.lock | awk '{print $1}')" = \
            "3f1fce29dd14fac81f56aaea1226131cd93d451c2c2ffe38730171e29e3697b4"
          cp uv.lock "$RUNNER_TEMP/baseline.lock"
          uv python install 3.14.7
          uv run --python 3.14.7 --managed-python --no-project python - <<'PY'
          import platform
          import sys
          import sysconfig

          assert platform.python_implementation() == "CPython"
          assert platform.machine() == "x86_64"
          assert sys.version_info[:3] == (3, 14, 7)
          assert sysconfig.get_config_var("Py_GIL_DISABLED") in (None, 0)
          PY

      - name: Apply approved candidate configuration
        shell: bash
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'dependencies = []': (
                  'dependencies = [\n'
                  '  "airportsdata==20260803",\n'
                  '  "duckdb==1.5.5",\n'
                  '  "tzdata==2026.3",\n'
                  ']'
              ),
              'dev = [\n  "mypy==2.3.0",': (
                  'dev = [\n'
                  '  "hypothesis==6.165.9",\n'
                  '  "mypy==2.3.0",'
              ),
              '  "ruff==0.16.3",\n]': (
                  '  "ruff==0.16.3",\n'
                  '  "sortedcontainers==2.4.0",\n'
                  ']'
              ),
              'exclude-newer = "2026-08-13T23:59:59Z"': (
                  'exclude-newer = "2026-08-13T23:59:59Z"\n'
                  'exclude-newer-package = { hypothesis = "2026-08-15T23:59:59Z" }'
              ),
              'no-build-package = [\n  "ast-serialize",': (
                  'no-build-package = [\n'
                  '  "airportsdata",\n'
                  '  "ast-serialize",'
              ),
              '  "colorama",': (
                  '  "colorama",\n'
                  '  "duckdb",\n'
                  '  "hypothesis",'
              ),
              '  "ruff",': (
                  '  "ruff",\n'
                  '  "sortedcontainers",'
              ),
              '  "tomlkit",': (
                  '  "tomlkit",\n'
                  '  "tzdata",'
              ),
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          python - <<'PY'
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert config["project"]["dependencies"] == [
              "airportsdata==20260803",
              "duckdb==1.5.5",
              "tzdata==2026.3",
          ]
          assert config["dependency-groups"]["dev"] == [
              "hypothesis==6.165.9",
              "mypy==2.3.0",
              "pytest==9.1.1",
              "ruff==0.16.3",
              "sortedcontainers==2.4.0",
          ]
          assert config["tool"]["uv"]["exclude-newer-package"] == {
              "hypothesis": "2026-08-15T23:59:59Z"
          }
          PY

      - name: Resolve and verify exact candidate graph
        shell: bash
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          uv lock --python 3.14.7 --managed-python
          uv lock --check --python 3.14.7 --managed-python
          python - "$RUNNER_TEMP/baseline.lock" uv.lock <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          baseline = tomllib.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          candidate = tomllib.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          root = "cargoopt-recovery"
          old = {item["name"]: item for item in baseline["package"] if item["name"] != root}
          new = {item["name"]: item for item in candidate["package"] if item["name"] != root}
          expected = {
              "airportsdata": "20260803",
              "duckdb": "1.5.5",
              "hypothesis": "6.165.9",
              "sortedcontainers": "2.4.0",
              "tzdata": "2026.3",
          }
          assert set(new) - set(old) == set(expected)
          assert set(old) - set(new) == set()
          for name, package in old.items():
              assert new[name] == package, name
          for name, version in expected.items():
              assert new[name]["version"] == version
              assert new[name]["source"] == {"registry": "https://pypi.org/simple"}
          assert candidate["options"]["exclude-newer"] == "2026-08-13T23:59:59Z"
          assert candidate["options"]["exclude-newer-package"] == {
              "hypothesis": "2026-08-15T23:59:59Z"
          }
          print("exact_external_packages", len(new))
          PY

      - name: Two clean-room frozen syncs
        shell: bash
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          for room in clean-1 clean-2; do
            mkdir "$RUNNER_TEMP/$room"
            cp -a . "$RUNNER_TEMP/$room/"
            (
              cd "$RUNNER_TEMP/$room"
              uv sync --frozen --all-groups --python 3.14.7 --managed-python
              uv sync --check --all-groups --python 3.14.7 --managed-python
              uv pip freeze --python .venv/bin/python --exclude-editable | LC_ALL=C sort \
                > "$RUNNER_TEMP/$room.inventory"
            )
          done
          cmp "$RUNNER_TEMP/clean-1.inventory" "$RUNNER_TEMP/clean-2.inventory"
          test "$(wc -l < "$RUNNER_TEMP/clean-1.inventory")" -eq 17
          sha256sum "$RUNNER_TEMP/clean-1.inventory"

      - name: Verify imports versions licenses and package status
        shell: bash
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          rm -rf .venv
          uv sync --frozen --all-groups --python 3.14.7 --managed-python
          uv run --frozen --no-sync python - <<'PY'
          import importlib
          import importlib.metadata
          import json
          import urllib.request

          expected = {
              "airportsdata": ("20260803", "MIT"),
              "duckdb": ("1.5.5", "MIT"),
              "hypothesis": ("6.165.9", "MPL-2.0"),
              "sortedcontainers": ("2.4.0", "Apache-2.0"),
              "tzdata": ("2026.3", "Apache-2.0"),
          }
          license_markers = {
              "MIT": ("MIT", "MIT License"),
              "MPL-2.0": ("MPL-2.0", "Mozilla Public License 2.0"),
              "Apache-2.0": ("Apache-2.0", "Apache Software License"),
          }
          evidence = {}
          for name, (version, license_id) in expected.items():
              importlib.import_module(name)
              assert importlib.metadata.version(name) == version
              with urllib.request.urlopen(
                  f"https://pypi.org/pypi/{name}/{version}/json", timeout=15
              ) as response:
                  payload = json.load(response)
              info = payload["info"]
              releases = payload["urls"]
              license_text = " | ".join(
                  [
                      str(info.get("license_expression") or ""),
                      str(info.get("license") or ""),
                      " | ".join(info.get("classifiers") or []),
                  ]
              )
              assert any(marker in license_text for marker in license_markers[license_id]), (
                  name,
                  license_text,
              )
              assert releases
              assert all(not item["yanked"] for item in releases)
              evidence[name] = {"license": license_id, "version": version, "yanked": False}
          print(json.dumps(evidence, sort_keys=True, separators=(",", ":")))
          PY

      - name: Audit candidate and export transient SBOM
        shell: bash
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          uv audit --frozen --output-format json > "$RUNNER_TEMP/audit.json"
          uv export --frozen --all-groups --format cyclonedx1.5 \
            --output-file "$RUNNER_TEMP/sbom.json"
          python - "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/sbom.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          audit = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          sbom = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert audit["summary"] == {
              "audited_packages": 18,
              "vulnerabilities": 0,
              "adverse_statuses": 0,
          }
          assert audit["vulnerabilities"] == []
          assert audit["adverse_statuses"] == []
          assert len(sbom["components"]) == 18
          assert sbom["specVersion"] == "1.5"
          print(json.dumps(audit["summary"], sort_keys=True, separators=(",", ":")))
          PY

      - name: Emit sanitized candidate bytes
        shell: bash
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          printf 'PH2_T03_PYPROJECT_B64=%s\n' "$(base64 -w0 pyproject.toml)"
          printf 'PH2_T03_UV_LOCK_B64=%s\n' "$(base64 -w0 uv.lock)"
          sha256sum pyproject.toml uv.lock

      - name: Mandatory transient cleanup
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/clean-1" \
            "$RUNNER_TEMP/clean-2" "$RUNNER_TEMP/uv-cache" \
            "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/sbom.json" \
            "$RUNNER_TEMP/baseline.lock" "$RUNNER_TEMP"/*.inventory
