  - AGENTS.md
  - docs/or/OR_INPUT_SCHEMA.yaml
  - docs/or/COST_MODEL_CONTRACT.md
  - pyproject.toml
  - uv.lock
  - docker-compose.yml
  - src/**
  - tests/**
  - frontend/**
  - migrations/**
  - knowledge/**
acceptance_criteria:
  - her shipment tam bir candidate flight'a atanmalı veya UNASSIGNED kalmalı
  - split shipment matematiksel olarak mümkün olmamalı
  - weight ve volume capacity hard constraint olmalı
  - eligibility dışı pair için karar değişkeni oluşturulmamalı
  - risk-blind ve ML-informed aynı set variable ve constraint'leri kullanmalı
  - iki MILP arasındaki tek business objective farkı expected risk cost olmalı
  - solver cost coefficient'leri integer kurus olmalı
  - greedy baseline deterministic ve risk-blind olmalı
  - unassigned değişkeni geçerli inputta yapısal feasibility sağlamalı
  - timeout hiçbir koşulda OPTIMAL olarak sunulmamalı
  - incumbent olmayan execution plan yayımlamamalı
  - solver native status ve configured gap birlikte raporlanmalı
  - validator Pyomo model veya solver object okuyamamalı
  - validator feasibility ve cost'u OR inputtan yeniden hesaplamalı
  - validator optimalite kanıtı ürettiğini iddia etmemeli
  - invalid plan UI backtest veya downstream tüketiciye yayımlanmamalı
  - PHASE_1 ile PHASE_8 kilitli kalmalı
  - kapsam dışı dosya dependency veya implementation oluşmamalı
tests_required:
  - bütün YAML dosyaları safe parser ile parse edilebilmeli
  - tam bir ACTIVE faz bulunmalı ve bu PHASE_0 olmalı
  - decision variable ve constraint isimleri belgeler arasında eşleşmeli
  - risk-blind ile ML-informed objective exact tek terimde ayrışmalı
  - bütün objective katsayıları kuruş integer sözleşmesine uymalı
  - greedy shipment ve candidate sort key'leri tam tanımlı olmalı
  - solver status enum'u exact beş durum içermeli
  - OPTIMAL yalnızca solver optimal termination ve gap <= 0.001 ile mümkün olmalı
  - FEASIBLE_TIMEOUT incumbent true gerektirmeli
  - INFEASIBLE NO_SOLUTION_TIMEOUT ve ERROR plan_emitted false gerektirmeli
  - output schema required alanlarının tamamı tanımlı ve benzersiz olmalı
  - validator reason code'ları benzersiz olmalı
  - validator cost ve capacity reconciliation kuralları bulunmalı
  - onaylı mevcut ve yeni dosyalar dışında dosya oluşmamalı
  - implementation dependency database ve UI yolları bulunmamalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
dependencies_allowed: false
migrations_allowed: false
stop_conditions:
  - onaylı dosya dışında değişiklik gereksinimi
  - cost veya constraint anlamının mevcut contractlarla çelişmesi
  - solver status'un yanlış başarı iddiası yaratması
  - validator'ın solver model state'ine bağımlı hale gelmesi
  - float cost ile kuruş reconciliation kaybı
  - unassigned varlığına rağmen geçerli inputun infeasible olması
  - blind replay evaluation kararının bu göreve taşınması
  - uygulama kodu dependency solver veya veri gereksinimi
  - mevcut kullanıcı dosyalarıyla çakışma
