hosted_execution_contract:
  platform: GitHub Actions
  runner: ubuntu-24.04
  trigger: PUSH_TO_MAIN_WHEN_EXACT_TEMPORARY_WORKFLOW_PATH_CHANGES
  workflow_name: PH2-T02-R1 Source Probe
  workflow_path: .github/workflows/ph2-t02-r1-probe.yml
  workflow_permissions: EMPTY_OBJECT_NO_TOKEN_SCOPE
  timeout_minutes: 12
  job_concurrency: 1
  cancel_in_progress: false
  checkout: FORBIDDEN
  actions_uses_steps: FORBIDDEN
  dependencies: FORBIDDEN
  cache: FORBIDDEN
  artifacts: FORBIDDEN
  secrets: FORBIDDEN
  oidc: FORBIDDEN
  environment: FORBIDDEN
  runtime: PREINSTALLED_SYSTEM_PYTHON_STANDARD_LIBRARY_ONLY
  runtime_minimum: CPython_3_12
  runtime_version_must_be_logged: true
  code_location: INLINE_IN_TEMPORARY_WORKFLOW_ONLY
  sanitized_log_prefix: PH2_T02_R1_RESULT_JSON=
  workflow_run_rerun: FORBIDDEN_WITHOUT_NEW_HUMAN_DECISION
network_policy:
  normative_probe_route: GITHUB_HOSTED_RUNNER_ONLY
  work_mode_direct_network: FORBIDDEN
  web_or_browser_retrieval: FORBIDDEN
  environment_proxies: DISABLED_IN_PYTHON_OPENER
  tls_verification: REQUIRED_DEFAULT_TRUST_STORE
  schemes: [https]
  hosts:
    - transtats.bts.gov
    - www.transtats.bts.gov
    - bts.gov
    - www.bts.gov
    - ntl.bts.gov
    - transportation.gov
    - www.transportation.gov
  fixed_entry_urls:
