acceptance_criteria:
  - PH0-T01 ile PH0-T05 tamamlanmış ve validation sonuçları kayıtlı olmalı
  - Phase 0 contract kimlikleri benzersiz ve artifact path'leri mevcut olmalı
  - registry dependency referansları çözülmeli ve graph cycle içermemeli
  - her contract tek owner component ve implementation phase taşımalı
  - proje kapsamındaki her Phase 0 kararı en az bir normative artifact'e izlenebilmeli
  - sensitivity exact dört non-baseline OFAT scenario ile sınırlandırılmalı
  - sensitivity yalnız triggered primary cohort üzerinde iki MILP'i karşılaştırmalı
  - sensitivity planner outcome okuyamamalı ve scenario planları outcome join'den önce dondurulmalı
  - sensitivity primary run status policy decision CI veya gate'i değiştirememeli
  - Phase 1 entry contract yalnız repository foundation kapsamını açmalı
  - dependency seçimi official source compatibility license ve clean sync kanıtı gerektirmeli
  - exit audit blocker varsa gate BLOCKED aksi halde READY_FOR_HUMAN_APPROVAL olmalı
  - Phase 1 bütün task boyunca LOCKED kalmalı
  - phase transition ayrı açık insan onayı olmadan gerçekleşmemeli
  - kapsam dışı dosya dependency implementation veya artifact oluşmamalı
tests_required:
  - bütün YAML dosyaları safe parser ile parse edilebilmeli
  - tam bir ACTIVE faz bulunmalı ve bu PHASE_0 olmalı
  - görev kapanışında active_task null ve PHASE_0 gate READY_FOR_HUMAN_APPROVAL olmalı
  - PHASE_1 ile PHASE_8 status LOCKED kalmalı
  - PH0 task ID'leri benzersiz ardışık ve PH0-T01..PH0-T06 COMPLETED olmalı
  - contract registry ID ve artifact path'leri benzersiz olmalı
  - registry dependency key'leri çözülmeli ve directed graph acyclic olmalı
  - registry source header ID'leriyle exact eşleşmeli
  - sensitivity scenario ID factor multiplier ve count exact olmalı
  - sensitivity base dışı dört scenario ve joint grid yasağı doğrulanmalı
  - sensitivity output primary release mapping alanı içermemeli
  - Phase 1 entry gate dependency ve clean-room test koşullarını içermeli
  - exit audit traceability satırları benzersiz olmalı ve açık blocker kalmamalı
  - önceki checkpoint'teki izinli mevcut dosyalar dışındaki dosyalar byte-identical kalmalı
  - implementation dependency database UI ve locked-phase yolları bulunmamalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
dependencies_allowed: false
migrations_allowed: false
stop_conditions:
  - unresolved contract reference veya dependency cycle bulunması
  - label cost constraint split blind veya release kuralları arasında çelişki bulunması
  - sensitivity'nin primary sonucu gate'i veya policy kararını değiştirmesi
  - sensitivity planner'a outcome erişimi gerekmesi
  - Phase 1 için current dependency version varsayımı yapılması
  - Phase 1 kilidini bu görev içinde açma gereksinimi
  - onaylı dosya dışında değişiklik dependency implementation veri veya solver gereksinimi
  - mevcut kullanıcı dosyalarıyla çakışma
