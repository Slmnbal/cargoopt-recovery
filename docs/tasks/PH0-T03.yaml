schema_version: 1
task_id: PH0-T03
phase: PHASE_0
status: COMPLETED
approved_at: "2026-08-13"
completed_at: "2026-08-13"
approval_source: explicit_user_approval
scope_amendment:
  approved_at: "2026-08-13"
  approval_source: explicit_user_approval
  reason: >-
    Uçuş-başı T-6 prediction ile kaynak uçuş T-6 anından başlayan
    24 saatlik candidate penceresi arasında gelecekte üretilmiş prediction
    kullanma riski bulundu. Tek multi-horizon model ve as-of seçim kuralı
    ile point-in-time leakage kapatılacak.
goal: >-
  Sentetik kargo, recovery case, aday uçuş kapasitesi, TRY maliyet modeli
  ve OR girdi sınırlarını uygulama kodundan önce kesinleştirmek.
in_scope:
  - tek kaynak uçuş ve tek destinasyonlu recovery case tanımı
  - ana merkez ve en fazla 10 destinasyon seçim anlamı
  - 24 saatlik recovery penceresi
  - STANDARD EXPRESS ve PHARMA gönderi sözleşmesi
  - ağırlık hacim hazır olma SLA ve cold-chain alanları
  - 50 ile 500 arasında deterministik gönderi üretim sözleşmesi
  - en fazla 30 doğrudan alternatif uçuş
  - sentetik ağırlık ve hacim kapasitesi sözleşmesi
  - SHA-256 tabanlı stateless deterministic sampling
  - nominal 2024 TRY maliyet katsayıları
  - risk-blind ve ML-informed objective katsayıları
  - immutable prediction batch bağlantısı
  - T-24 T-18 T-12 T-6 multi-horizon tahmin ladder sözleşmesi
  - tek modele lead_time_hours feature eklenmesi
  - recovery karar anında latest-available as-of prediction seçimi
  - OR input schema ve fail-closed doğrulama kuralları
  - gerçek outcome alanlarının generator ve objective dışında tutulması
out_of_scope:
  - Python uygulama veya test kodu
  - sentetik veri üretmek
  - BTS verisi indirmek veya işlemek
  - pyproject.toml veya dependency
  - Pyomo modeli veya HiGHS kurulumu
  - solver ayarı veya optimizasyon çalıştırmak
  - database veya migration
  - model eğitimi veya MLflow run
  - backtest case seçimi ve istatistiksel değerlendirme
  - API frontend RAG LLM veya Hugging Face
