acceptance_criteria:
  - yalnız official primary source veya canonical package metadata kullanılmalı
  - her source URL erişim tarihi ve desteklediği claim ile kaydedilmeli
  - Python runtime exact minor version ve support gerekçesi taşımalı
  - package manager exact version ve frozen deterministic sync kanıtı taşımalı
  - build backend exact version ve minimal src-layout gerekçesi taşımalı
  - foundation quality araçları exact version ve rol ayrımı taşımalı
  - her dependency için amaç alternatif lisans maintenance security transitive impact ve removal cost bulunmalı
  - runtime dependency ile development dependency ayrılmalı
  - broad range latest yanked pre-release Git URL veya unpinned branch önerilmemeli
  - Phase 2 ile Phase 8 paketi kataloğa eklenmemeli
  - PH1-T02 scaffold planı yalnız foundation dosyalarını içermeli
  - clean-room komutları boş environment frozen sync ikinci sync import lint type ve test akışını kapsamalı
  - hiçbir dependency veya implementation artifact'ı oluşmamalı
tests_required:
  - bütün yeni YAML dosyaları safe parser ile parse edilebilmeli
  - research source'larının her biri official domain veya canonical package metadata olmalı
  - exact candidate version alanları boş veya latest olmamalı
  - seçilen bütün araçların aynı Python runtime üzerinde uyumlu olduğu kanıtlanmalı
  - SPDX license alanları dolu olmalı
  - direct dependency listesi yalnız foundation araçlarından oluşmalı
  - scaffold planında Phase 2+ path veya placeholder bulunmamalı
  - verification komutları lock mutation yapmayan frozen mode içermeli
  - onaylı files_allowed dışında dosya değişmemeli
  - pyproject lock source tests ve CI yolları bulunmamalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
dependencies_allowed: false
migrations_allowed: false
external_research_allowed: true
research_source_policy: OFFICIAL_PRIMARY_ONLY
stop_conditions:
  - official compatibility license maintenance veya security bilgisi doğrulanamazsa
  - seçilen araçlar için ortak supported Python runtime bulunamazsa
  - exact version yalnız pre-release yanked veya unsupported ise
  - dependency çözümünü doğrulamak için bu görevde install veya lock üretmek gerekirse
  - Phase 2+ dependency veya abstraction gereksinimi doğarsa
  - onaylı files_allowed dışında değişiklik gerekirse
  - araştırma kapsamı official-primary-source sınırının dışına çıkarsa
