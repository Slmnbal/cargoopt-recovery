goal: >-
  Phase 0 kapsam kararlarını contract ve ADR düzeyinde çapraz denetlemek,
  eksik sensitivity analysis sınırını primary blind sonucu değiştirmeyecek
  biçimde kapatmak ve Phase 1 geçişini yalnızca ayrı insan onayına sunulabilir
  hale getiren ölçülebilir bir exit/entry kapısı üretmek.
in_scope:
  - PH0-T01 ile PH0-T05 görev sonuçlarının exit audit'i
  - proje kapsamı contract ADR task ve faz durumunun traceability denetimi
  - contract kimliği sürümü sahipliği uygulama fazı ve dependency registry
  - contract dependency graph için cycle ve unresolved reference kontrolü
  - scope-limited one-factor-at-a-time sensitivity analysis sözleşmesi
  - sensitivity planning ile outcome evaluation rol ayrımı
  - sensitivity sonucunun primary blind release kararını değiştirmeme kuralı
  - Phase 1 entry precondition allowed scope exit criteria ve stop conditions
  - Phase 0 gate için READY_FOR_HUMAN_APPROVAL veya BLOCKED kararı
  - phase transition için ayrı açık insan onayı zorunluluğu
out_of_scope:
  - Phase 0 durumunu COMPLETED yapmak veya Phase 1 kilidini açmak
  - Python runtime veya dependency sürümü seçmek
  - pyproject.toml uv.lock source test CI veya repository scaffold oluşturmak
  - BTS verisi indirmek sentetik veri üretmek model eğitmek veya solver çalıştırmak
  - sensitivity scenario'larını execute etmek veya outcome açmak
  - database migration API frontend Docker ya da deployment
  - Phase 2 ile Phase 8 implementation veya placeholder hazırlığı
  - RAG LLM Hugging Face pgvector veya Ollama
