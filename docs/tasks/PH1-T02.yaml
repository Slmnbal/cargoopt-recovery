  - migrations/**
  - knowledge/**
  - any source file other than src/cargoopt_recovery/__init__.py
  - any test file other than tests/test_package_import.py

transient_paths:
  allowed_during_execution:
    - .venv/**
    - .ruff_cache/**
    - .mypy_cache/**
    - .pytest_cache/**
    - __pycache__/**
    - operating-system temporary build directory outside repository
  checkpoint_rule: MUST_BE_EXCLUDED_OR_REMOVED_BEFORE_ARCHIVE

pyproject_contract:
  project:
    name: cargoopt-recovery
    version: 0.1.0
    requires_python: ">=3.14,<3.15"
    dependencies: []
    dynamic_fields: []
    scripts: []
  build_system:
    requires:
      - hatchling==1.32.0
    build_backend: hatchling.build
  dependency_groups:
    dev:
      - ruff==0.16.3
      - mypy==2.3.0
      - pytest==9.1.1
  uv:
    default_groups: [dev]
    exclude_newer: "2026-08-13T23:59:59Z"
    alternate_sources: []
    audit_malware_check: true
    audit_ignore_list: []
    third_party_source_build_policy:
      local_project_editable_build_allowed: true
      no_build_package:
        - ast-serialize
        - colorama
        - hatchling
        - iniconfig
        - librt
        - mypy
        - mypy-extensions
        - packaging
        - pathspec
        - pluggy
        - pygments
        - pytest
        - ruff
        - tomlkit
        - trove-classifiers
        - typing-extensions
  hatch:
    wheel_packages:
      - src/cargoopt_recovery
  ruff:
    target_version: py314
    line_length: 100
    lint_select: [E4, E7, E9, F, I, UP, B]
    lint_fix_in_gate: false
  mypy:
    python_version: "3.14"
    strict: true
    paths: [src, tests]
    rule_weakening_allowed: false
  pytest:
    testpaths: [tests]
    strict_config: true
    strict_markers: true
    third_party_plugin_autoload_in_gate: false

execution_sequence:
  - step: 1
    name: repository_preflight
    actions:
      - verify current phase task and exact allowlist
      - verify no forbidden or unexpected implementation path exists
      - verify uv version equals 0.12.3
      - verify requested interpreter is standard GIL-enabled CPython 3.14.7
    gate: ALL_PASS_OR_STOP
  - step: 2
    name: metadata_only
    actions:
      - create .python-version
      - create .gitignore
      - create pyproject.toml exactly from pyproject_contract
      - parse TOML and verify exact direct pins before resolution
    gate: ALL_PASS_OR_STOP
  - step: 3
    name: single_lock_resolution
    actions:
      - resolve uv.lock once using uv 0.12.3 canonical PyPI and fixed exclude-newer cutoff
      - prohibit pre-release Git path editable alternate-index and manual lock edits
    gate: LOCK_CREATED_OR_STOP
  - step: 4
    name: lock_graph_review
    actions:
      - compare direct and transitive graph with dependency catalog estimate
      - inspect source types markers versions wheel availability and yanked metadata
      - update dependency catalog with observed graph without changing approved direct pins
    gate: NO_UNEXPECTED_OR_ADVERSE_RESULT_OR_STOP
  - step: 5
    name: minimal_package_shell
    actions:
      - create only src/cargoopt_recovery/__init__.py
      - expose only package docstring and __version__ equal to project version 0.1.0
      - create only tests/test_package_import.py
      - create foundation-only README.md with exact local commands and phase-lock warning
    gate: EXACT_FILE_ALLOWLIST_OR_STOP
  - step: 6
    name: local_frozen_validation
    actions:
      - run uv lock check without mutation
      - run one frozen exact sync
      - run package import and version smoke
      - run Ruff format check and lint as independent commands
      - run mypy strict over src and tests
      - run pytest with third-party plugin autoload disabled
      - build wheel and sdist into an operating-system temporary directory outside repository
      - inspect artifact metadata and import installed wheel in an isolated temporary environment
    gate: ALL_COMMANDS_EXIT_ZERO_WITHOUT_RULE_WEAKENING
  - step: 7
    name: scope_and_state_closeout
    actions:
      - verify runtime dependency count remains zero
      - verify no Phase 2+ dependency path abstraction TODO or placeholder exists
      - verify lock and metadata remain unchanged after validation
      - update compatibility matrix task status phase status and project status
      - create checkpoint excluding transient files
    gate: READY_FOR_PH1_T03_PLANNING_ONLY

acceptance_criteria:
  - only files in the exact files_allowed list are created or modified
  - uv executable version is exactly 0.12.3
  - interpreter is standard GIL-enabled CPython exactly 3.14.7
  - pyproject project runtime dependency count is zero
  - build and development direct dependencies exactly match approved_toolchain_snapshot
  - every direct package declaration uses an exact equality pin
  - uv.lock is generated by the approved manager without manual edit
  - lock contains no Git path editable alternate-index pre-release or yanked dependency
  - unexpected source distribution or native compiler requirement is absent
  - src package contains no business behavior placeholder interface adapter TODO or future-phase import
  - package __version__ and project version are exactly 0.1.0
  - import smoke succeeds from the frozen project environment
  - Ruff format check and Ruff lint pass independently
  - mypy strict passes for src and tests
  - pytest smoke passes with third-party plugin autoload disabled
  - local isolated build smoke and installed-wheel import pass
  - validation does not mutate pyproject.toml or uv.lock
  - README commands match the commands actually executed
  - no quality rule test or assertion is weakened to obtain a pass
  - Phase 2 through Phase 8 remain LOCKED
  - PH1-T03 is not created or started

tests_required:
  - parse all repository YAML files with a safe YAML parser
  - parse pyproject.toml with Python standard library tomllib
  - validate exact path allowlist against pre-task manifest
  - validate exact runtime package-manager build-backend and dev-tool versions
  - validate empty project.dependencies and exact dev group membership
  - validate uv.lock metadata consistency with uv lock --check
  - validate lock source and version policy with a deterministic parser
  - validate importlib package discovery import and __version__ equality
  - run ruff format --check as a non-mutating command
  - run ruff check as a non-mutating command without fix
  - run mypy strict without per-file ignore or config relaxation
  - run pytest with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
  - build outside repository and inspect package name version and Python requirement
  - install built wheel into a temporary isolated environment and import package
  - verify pyproject.toml and uv.lock hashes before and after validation are equal
  - verify no conflict marker or unbalanced Markdown code fence exists
  - verify transient files are absent from checkpoint archive

dependencies_allowed: true
dependency_change_policy:
  allowed_exact_only:
    - hatchling==1.32.0
    - ruff==0.16.3
    - mypy==2.3.0
    - pytest==9.1.1
  project_runtime_dependencies_allowed: false
  package_manager_dependency_allowed: false
  new_or_changed_direct_dependency_requires_stop: true
migrations_allowed: false
network_access:
  allowed_after_execution_approval: true
  allowed_hosts: [pypi.org, files.pythonhosted.org, astral.sh, python.org]
  purpose: approved runtime availability and canonical package resolution only

stop_conditions:
  - explicit PH1-T02 execution approval is absent
  - repository state no longer matches the approved precondition snapshot
  - uv version is not exactly 0.12.3
  - standard GIL-enabled CPython 3.14.7 cannot be obtained or verified
  - an approved exact release is unavailable incompatible yanked pre-release deprecated or adversely flagged
  - canonical PyPI resolution fails or requires source substitution
  - lock graph contains unexpected package Git path editable alternate-index or unexplained native build
  - a direct pin runtime range cutoff source or quality policy would need to change
  - a new dependency plugin config module CLI or helper tool appears necessary
  - quality gates pass only by weakening rule strictness test or assertion
  - files outside the exact allowlist would need creation or modification
  - Phase 2+ path dependency abstraction TODO placeholder or business behavior appears necessary
  - local validation mutates pyproject.toml or uv.lock unexpectedly
  - existing user work conflicts with an allowed target file
  - PH1-T03 clean-room CI audit or license work becomes necessary to finish this task

handoff:
  on_success: >-
    Mark PH1-T02 COMPLETED, keep Phase 1 ACTIVE, set the next gate to
    PH1_T03_PLANNING_REQUIRED and wait for a separate user request; do not create
    or start PH1-T03 automatically.
  on_failure: >-
    Preserve the last verified gate, record the exact blocker, make no fallback
    dependency or scope expansion, and return to human decision.

