stop_conditions:
  - PH1-T03 execution approval is absent
  - recorded CI stack approval no longer exactly matches the planned stack
  - approved CI release SHA runner trigger permission cache or secret policy would need to change
  - current repository or PH1-T02 checkpoint no longer matches precondition hashes
  - a user change conflicts with files_allowed
  - uv 0.12.3 or standard GIL-enabled CPython 3.14.7 cannot be verified
  - canonical source exact release SHA license or provenance cannot be verified
  - frozen sync changes lock or needs an alternate index source build or compiler
  - second frozen sync changes normalized environment inventory
  - any import format lint type test or build gate fails
  - passing requires rule test assertion type or audit weakening
  - vulnerability deprecation quarantine malware yanked or other adverse status is found
  - any audit ignore allowlist suppression insecure-host or override appears necessary
  - observed build graph and temporary audited build graph do not match
  - a license is missing unknown prohibited conflicting or operationally unacceptable
  - a new dependency helper script action workflow or file outside allowlist appears necessary
  - GitHub remote main branch write authorization or hosted-run evidence is unavailable
  - final CI run does not correspond to the final reported commit SHA
  - GitHub-hosted run fails is cancelled skipped or cannot prove exact action SHAs
  - Phase 2+ implementation dependency abstraction TODO or placeholder appears
  - Phase 1 close or Phase 2 transition would be required within this task

failure_states:
  local_or_audit_failure: BLOCKED_TECHNICAL_EVIDENCE
  ci_stack_change_needed: BLOCKED_NEW_CI_APPROVAL
  external_repository_unavailable: BLOCKED_EXTERNAL_CI_EVIDENCE
  security_or_license_finding: BLOCKED_HUMAN_RISK_DECISION
  scope_expansion_needed: BLOCKED_NEW_TASK_PLAN

handoff:
  current_pending_handoff: >-
    Local clean-room, audit, build, license, SBOM ve workflow kapıları
    tamamlandı. PH1-T03'ü ancak committed state'e ait gerçek GitHub-hosted
    Foundation run sonucu success olduğunda kapat.
  on_execution_success: >-
    Mark PH1-T03 COMPLETED, keep Phase 1 ACTIVE, set its gate to
    READY_FOR_HUMAN_APPROVAL, keep Phase 2 through Phase 8 LOCKED, and wait for
    an explicit Phase 1 close plus Phase 2 open transition request.
  on_execution_blocker: >-
    Preserve the last verified gate and immutable evidence, record the exact
    blocker, add no fallback or scope expansion, and return to human decision.

