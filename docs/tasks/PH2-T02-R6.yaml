  - fresh fingerprint and exact-four excluded set both pass before POST
  - exactly 15 distinct target checkbox controls are submitted
  - POST count temporary ZIP count and header record count never exceed one
  - data_rows_read is exactly zero in every result
  - exact ordered header equality is required for SOURCE_COMPATIBLE
  - cleanup_path_absent is true before result is printed
  - hidden cookie POST body ZIP CSV and absolute temp path content is never logged
  - both temporary workflows are absent at final main
  - PH2-T03 remains absent and Phase 3 through Phase 8 remain locked
  - hosted Extract and all Foundation runs pass with zero artifacts
tests_required:
