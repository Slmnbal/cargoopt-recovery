goal: >-
  CargoOpt Recovery için hiçbir dependency eklemeden, resmi primary sources
  üzerinden exact Python runtime, package manager, build backend ve yalnız
  repository-foundation kalite araçlarını karşılaştırmak; uyumlu, lisansı
  doğrulanmış ve clean-room kurulabilir tek bir pinned toolchain önerisini
  PH1-T02 scaffold planına dönüştürmek.
in_scope:
  - official Python support ve lifecycle araştırması
  - package manager ve lock/frozen-sync davranışı araştırması
  - build backend seçenekleri ve src-layout uyumluluğu
  - formatter linter type checker ve test runner seçenekleri
  - exact candidate version release support license ve security kontrolü
  - Linux CPU-first local environment uyumluluğu
  - direct ve transitive dependency etki tahmini
  - standard library veya daha küçük alternatif analizi
  - deterministic clean environment komut sözleşmesi
  - PH1-T02 için exact file-by-file scaffold planı
  - runtime toolchain ADR önerisi
out_of_scope:
  - dependency kurmak indirmek veya lock çözmek
  - pyproject.toml uv.lock source test CI ya da package shell oluşturmak
  - Phase 2 ile Phase 8 dependency'lerini seçmek
  - pandas polars scikit-learn XGBoost MLflow Pyomo HiGHS FastAPI PostgreSQL React Docker RAG LLM veya Hugging Face kararı
  - BTS verisi indirmek model eğitmek solver çalıştırmak
  - GitHub Actions veya başka CI workflow dosyası oluşturmak
  - ücretli API managed service ya da cloud zorunluluğu
