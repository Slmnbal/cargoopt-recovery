acceptance_criteria:
  - task approval and exact scope are committed before hosted network starts
  - workflow uses permissions empty object and contains no uses step
  - fresh fingerprint equals the immutable R2 fingerprint before POST
  - exactly 15 distinct checkbox controls plus exact year and month are submitted
  - no hidden cookie or response content is logged
  - no more than one POST and one temporary ZIP can occur
  - only one safe CSV member is opened
  - reading stops immediately after the first LF of the CSV record
  - data_rows_read is exactly zero in every result
  - temporary path is absent before sanitized result is printed
  - workflow is absent at final main and no Action artifact exists
  - PH2-T03 remains absent and Phase 3 through Phase 8 remain locked
  - result and final Foundation runs pass with zero artifacts
tests_required:
  - all repository YAML parses
  - workflow structure and forbidden-key scan passes
  - inline Python AST parses and imports standard library only
  - synthetic in-memory parser and one-member ZIP header tests pass offline
  - fingerprint-before-POST request-count redirect timeout and byte-cap invariants pass
  - sanitize result schema and forbidden-content checks pass offline
  - immutable foundation dependency lock source tests and prior reports retain hashes
  - hosted Extract and Foundation runs complete and expose zero artifacts
  - workflow removal is proven by remote 404
  - final Foundation closeout run passes with zero artifacts
dependencies_allowed: false
migrations_allowed: false
product_implementation_allowed: false
extract_allowed: true
persistent_data_allowed: false
automatic_rerun_allowed: false
stop_conditions:
  - fresh form fingerprint differs from the immutable R2 hash
  - exact form method action year month fields or submit control is ambiguous
  - authentication CAPTCHA manual state or a non-approved host is required
  - POST redirect would replay POST with 307 or 308
  - response exceeds a byte count timeout redirect request or archive safety cap
  - more than one temporary path or any persistent archive would be required
  - archive contains anything other than one safe regular non-encrypted CSV member
  - header requires reading after its first newline or does not equal exact ordered 15
  - cleanup cannot prove the temporary path absent
  - dependency artifact secret source test config data migration or PH2-T03 work is required
