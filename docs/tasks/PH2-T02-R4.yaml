  post_retries: 0
  automatic_reruns: 0
  minimum_interval_seconds: 1
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  form_max_bytes: 8388608
  outbound_form_max_bytes: 8388608
zip_policy:
  temporary_zip_count_max: 1
  compressed_byte_limit: 268435456
  archive_member_count_exact: 1
  member_type: REGULAR_NON_ENCRYPTED_CSV
  declared_uncompressed_byte_limit: 2147483648
  header_byte_limit: 1048576
  persistent_archive: FORBIDDEN
  raw_redistribution: FORBIDDEN
header_policy:
  records_read_max: 1
  data_rows_read_exact: 0
  stop_read_at_first_lf: true
  transformations_allowed: [UTF8_BOM_REMOVAL]
  exact_ordered_equality_required: true
sanitization_policy:
  forbidden_in_logs:
    - raw HTML
    - cookie values
    - hidden field values
    - viewstate or event-validation values
    - POST body
    - ZIP bytes
    - CSV member bytes
    - CSV data rows
    - absolute temporary path
  temporary_path_log_form: SHA256_OF_ABSOLUTE_PATH_STRING_ONLY
  result_format: ONE_CANONICAL_JSON_LINE
