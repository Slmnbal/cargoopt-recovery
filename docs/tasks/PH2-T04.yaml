  source_distribution_allowed: false
  test_network_scope: LOOPBACK_TEMPORARY_HTTP_SERVER_ONLY

execution_sequence:
  - record satisfied PH2-T03 and combined authorization preconditions
  - add data root ignore rule without creating persistent data bytes
  - write exact production acquisition config and operator runbook
  - implement manifest value objects canonical JSON hash and immutable writer
  - implement guarded request redirect retry bounded stream and atomic publish
  - implement safe streaming ZIP inspection CRC and exact physical header gate
  - add two header-only synthetic fixtures
  - add positive negative and cleanup-focused unit and integration tests
  - run local parser format lint type test and package build gates where available
  - publish result candidate and verify exact hosted Foundation
  - close task only after hosted success and artifact zero

acceptance_criteria:
  - no dependency or workflow change
  - production policy defaults to HTTPS and exact BTS host/port allowlist
  - initial and every redirect/final URL are validated
  - POST is never automatically retried or redirected
  - response cannot exceed configured header or streamed byte limit
  - declared and observed content length mismatch fails closed
  - incomplete oversize or rejected download leaves no destination or part file
  - destination cannot be overwritten even by an otherwise valid response
  - unsafe duplicate encrypted symlink oversized high-ratio or CRC-bad ZIP fails
  - raw header must exactly equal the accepted ordered 15 physical fields
  - manifest serialization is canonical and content hash reproducible
  - same artifact ID with different raw hash fails closed
  - tests make zero external network request and use only temporary paths
  - no real source data row or archive enters repository or workflow artifact
  - hosted Foundation passes all gates with zero artifacts

tests_required:
  - valid bounded loopback download and stream SHA-256
  - same-origin redirect pass and cross-origin redirect rejection
  - truncated Content-Length response rejection and cleanup
  - declared oversize and streamed oversize rejection and cleanup
  - retryable GET bounded retry and POST zero-retry
  - existing destination no-overwrite
  - valid one-member ZIP and exact 15 physical header
  - wrong header path traversal duplicate member symlink encrypted flag size ratio and CRC failure
  - canonical manifest bytes and fixed SHA-256
  - immutable manifest idempotency and same-ID different-hash conflict
  - config exact 12 periods exact 15 ordered fields and HTTPS production policy
  - YAML JSON TOML parse conflict-marker format lint mypy strict pytest build and audit

