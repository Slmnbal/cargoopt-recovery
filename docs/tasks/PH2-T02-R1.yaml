  next_task_rule: PH2_T03_FORBIDDEN
acceptance_criteria:
  - exact execution approval task içinde bootstrap commit'inden önce kaydedilmeli
  - plan base main commit ve hosted Foundation success yeniden doğrulanmalı
  - temporary workflow exact path dışında hiçbir workflow değişmemeli
  - temporary workflow permissions empty object checkout actions uses secrets cache artifact ve dependency içermemeli
  - discovery ve extract ayrı run olmalı ve extract discovery review gate geçmeden oluşturulmamalı
  - normative probe request'leri yalnız hosted runner'dan official HTTPS allowlist'e gitmeli
  - toplam request sayısı iki run toplamında en fazla 12 olmalı
  - selected request fixed January 2024 ve exact ordered 15 field olmalı
  - en fazla bir temporary artifact ve sıfır data row olmalı
  - response archive header rights request ve cleanup kanıtı sanitized JSON'da bulunmalı
  - tek closed result üretilmeli ve success kanıtlanmadan SOURCE_COMPATIBLE seçilmemeli
  - workflow result report yazılmadan önce repository'den silinmeli
  - final main'de workflow script data artifact cache dependency PH2-T03 veya Phase 3+ placeholder kalmamalı
  - final repository diff'i yalnız kalıcı files_allowed dokümanlarında olmalı
tests_required:
  - bütün repository YAML dosyaları safe parser ile parse edilebilmeli
  - temporary workflow YAML structure ve forbidden-key scan geçmeli
  - workflow yalnız exact push branch path runner timeout permission ve concurrency contract'ını taşımalı
  - inline Python ast parse ve standard-library import allowlist kontrolü geçmeli
  - discovery ve extract JSON schema canonicalization fingerprint ve redaction validator'ları offline geçmeli
  - request redirect host scheme method count retry interval timeout ve duration invariants geçmeli
  - ZIP single regular unencrypted CSV member declared size compressed size and header-read caps geçmeli
  - parsed header exact ordered 15 equality veya explicit NOT_RUN closed failure bulunmalı
  - data_rows_read değeri exact 0 olmalı
  - temporary cleanup path absence success failure ve interruption yollarında true olmalı
  - pyproject uv.lock Foundation workflow source tests configs contracts ve prior PH2-T02 report byte-identical kalmalı
  - final main'de retry workflow path scripts data configs artifacts PH2-T03 ve Phase 3+ dosyaları bulunmamalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
  - result commit ve final closeout commit hosted Foundation workflow'unda success olmalı
