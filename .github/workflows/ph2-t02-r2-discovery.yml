name: PH2-T02-R2 Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ph2-t02-r2-discovery.yml

permissions: {}

concurrency:
  group: ph2-t02-r2-discovery
  cancel-in-progress: false

jobs:
  discovery:
    name: Official form and rights discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Run bounded standard-library discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import http.client
          import json
          import platform
          import re
          import ssl
          import time
          from html.parser import HTMLParser
          from typing import Any
          from urllib.parse import urljoin, urlsplit


          PREFIX = "PH2_T02_R2_RESULT_JSON="
          MAX_REQUESTS = 6
          MAX_REDIRECTS = 2
          MAX_BYTES = 8 * 1024 * 1024
          CONNECT_TIMEOUT = 10
          READ_TIMEOUT = 60
          MIN_INTERVAL = 1.0
          ALLOWED_HOSTS = {
              "www.transtats.bts.gov",
              "transtats.bts.gov",
              "catalog.data.gov",
              "data.gov",
              "www.data.gov",
              "usa.gov",
              "www.usa.gov",
          }
          URLS = [
              (
                  "selected_form",
                  "https://www.transtats.bts.gov/"
                  "DL_SelectFields.aspx?QO_fu146_anzr=b0-gvzr&gnoyr_VQ=FGJ",
              ),
              (
                  "bts_flight_catalog",
                  "https://catalog.data.gov/api/3/action/"
                  "package_show?id=bts-flight-data",
              ),
              (
                  "marketing_catalog",
                  "https://catalog.data.gov/api/3/action/"
                  "package_show?id=u-s-marketing-air-carriers-on-time-performance",
              ),
              ("government_works", "https://www.usa.gov/government-works"),
          ]
          EXPECTED_FIELDS = [
              "FlightDate",
              "Reporting_Airline",
              "DOT_ID_Reporting_Airline",
              "Flight_Number_Reporting_Airline",
              "OriginAirportID",
              "Origin",
              "DestAirportID",
              "Dest",
              "CRSDepTime",
              "CRSArrTime",
              "CRSElapsedTime",
              "Distance",
              "Cancelled",
              "Diverted",
              "ArrDelayMinutes",
          ]


          def canonical(value: Any) -> bytes:
              return json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")


          def sha256(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()


          def normalize(value: str) -> str:
              return re.sub(r"[^a-z0-9]", "", value.lower())


          def check_url(url: str) -> tuple[str, str]:
              parsed = urlsplit(url)
              host = (parsed.hostname or "").lower()
              if parsed.scheme != "https" or host not in ALLOWED_HOSTS:
                  raise RuntimeError("URL_POLICY_VIOLATION")
              if parsed.username or parsed.password or parsed.fragment:
                  raise RuntimeError("URL_CREDENTIAL_OR_FRAGMENT_FORBIDDEN")
              return host, parsed.path or "/"


          class Client:
              def __init__(self) -> None:
                  self.count = 0
                  self.redirects = 0
                  self.last_at: float | None = None
                  self.context = ssl.create_default_context()

              def get(self, requested_url: str) -> tuple[dict[str, Any], bytes]:
                  current = requested_url
                  chain: list[dict[str, Any]] = []
                  started = time.monotonic()
                  while True:
                      if self.count >= MAX_REQUESTS:
                          raise RuntimeError("REQUEST_BUDGET_EXCEEDED")
                      host, _ = check_url(current)
                      parsed = urlsplit(current)
                      target = parsed.path or "/"
                      if parsed.query:
                          target += "?" + parsed.query
                      now = time.monotonic()
                      if self.last_at is not None:
                          remaining = MIN_INTERVAL - (now - self.last_at)
                          if remaining > 0:
                              time.sleep(remaining)
                      self.count += 1
                      self.last_at = time.monotonic()
                      connection = http.client.HTTPSConnection(
                          host,
                          parsed.port or 443,
                          timeout=CONNECT_TIMEOUT,
                          context=self.context,
                      )
                      try:
                          connection.request(
                              "GET",
                              target,
                              headers={
                                  "Accept": "application/json,text/html,application/xhtml+xml",
                                  "Accept-Encoding": "identity",
                                  "User-Agent": "CargoOptRecovery-PH2-T02-R2/1.0",
                              },
                          )
                          response = connection.getresponse()
                          if connection.sock is not None:
                              connection.sock.settimeout(READ_TIMEOUT)
                          status = response.status
                          location = response.getheader("Location")
                          if status in {301, 302, 303, 307, 308}:
                              if not location:
                                  raise RuntimeError("REDIRECT_WITHOUT_LOCATION")
                              self.redirects += 1
                              if self.redirects > MAX_REDIRECTS:
                                  raise RuntimeError("REDIRECT_BUDGET_EXCEEDED")
                              next_url = urljoin(current, location)
                              next_host, _ = check_url(next_url)
                              chain.append(
                                  {
                                      "from_host": host,
                                      "status": status,
                                      "to_host": next_host,
                                      "to_url": next_url,
                                  }
                              )
                              response.read()
                              current = next_url
                              continue
                          body = bytearray()
                          while True:
                              chunk = response.read(65536)
                              if not chunk:
                                  break
                              body.extend(chunk)
                              if len(body) > MAX_BYTES:
                                  raise RuntimeError("RESPONSE_BYTE_LIMIT_EXCEEDED")
                          raw = bytes(body)
                          metadata = {
                              "requested_url": requested_url,
                              "final_url": current,
                              "status": status,
                              "content_type": response.getheader("Content-Type"),
                              "content_length": response.getheader("Content-Length"),
                              "etag": response.getheader("ETag"),
                              "last_modified": response.getheader("Last-Modified"),
                              "byte_count": len(raw),
                              "sha256": sha256(raw),
                              "redirects": chain,
                              "elapsed_ms": round((time.monotonic() - started) * 1000),
                          }
                          return metadata, raw
                      finally:
                          connection.close()


          class FormParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.forms: list[dict[str, Any]] = []
                  self.form_stack: list[int] = []
                  self.controls: list[dict[str, Any]] = []
                  self.current_select: dict[str, Any] | None = None
                  self.current_option: dict[str, Any] | None = None
                  self.last_visible_control: dict[str, Any] | None = None
                  self.text_parts: list[str] = []

              @staticmethod
              def attrs(attrs: list[tuple[str, str | None]]) -> dict[str, str]:
                  return {key.lower(): value or "" for key, value in attrs}

              @property
              def form_index(self) -> int | None:
                  return self.form_stack[-1] if self.form_stack else None

              def handle_starttag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  tag = tag.lower()
                  values = self.attrs(attrs)
                  if tag == "form":
                      index = len(self.forms)
                      self.forms.append(
                          {
                              "index": index,
                              "action": values.get("action", ""),
                              "method": values.get("method", "get").upper(),
                              "id": values.get("id", ""),
                              "name": values.get("name", ""),
                          }
                      )
                      self.form_stack.append(index)
                      self.last_visible_control = None
                  elif tag == "input":
                      control_type = values.get("type", "text").lower()
                      control: dict[str, Any] = {
                          "tag": "input",
                          "type": control_type,
                          "name": values.get("name", ""),
                          "id": values.get("id", ""),
                          "form_index": self.form_index,
                          "checked": "checked" in values,
                          "disabled": "disabled" in values,
                          "following_text": "",
                      }
                      raw_value = values.get("value", "")
                      if control_type == "hidden":
                          control["value_present"] = bool(raw_value)
                      elif control_type in {"checkbox", "radio", "submit", "button"}:
                          control["value"] = raw_value[:256]
                      self.controls.append(control)
                      self.last_visible_control = (
                          control if control_type in {"checkbox", "radio"} else None
                      )
                  elif tag == "select":
                      self.current_select = {
                          "tag": "select",
                          "type": "select",
                          "name": values.get("name", ""),
                          "id": values.get("id", ""),
                          "form_index": self.form_index,
                          "disabled": "disabled" in values,
                          "options": [],
                      }
                      self.controls.append(self.current_select)
                      self.last_visible_control = None
                  elif tag == "option" and self.current_select is not None:
                      self.current_option = {
                          "value": values.get("value", "")[:256],
                          "label": "",
                          "selected": "selected" in values,
                          "disabled": "disabled" in values,
                      }
                      self.current_select["options"].append(self.current_option)

              def handle_startendtag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  self.handle_starttag(tag, attrs)

              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if tag == "form" and self.form_stack:
                      self.form_stack.pop()
                      self.last_visible_control = None
                  elif tag == "select":
                      self.current_select = None
                  elif tag == "option":
                      self.current_option = None

              def handle_data(self, data: str) -> None:
                  compact = " ".join(data.split())
                  if not compact:
                      return
                  self.text_parts.append(compact)
                  if self.current_option is not None:
                      self.current_option["label"] = (
                          self.current_option["label"] + " " + compact
                      ).strip()[:256]
                  elif self.last_visible_control is not None:
                      self.last_visible_control["following_text"] = (
                          self.last_visible_control["following_text"] + " " + compact
                      ).strip()[:512]


          def decode(raw: bytes, content_type: str | None) -> str:
              match = re.search(r"charset=([A-Za-z0-9._-]+)", content_type or "", re.I)
              charset = match.group(1) if match else "utf-8"
              try:
                  return raw.decode(charset, errors="replace")
              except LookupError:
                  return raw.decode("utf-8", errors="replace")


          def safe_control(control: dict[str, Any]) -> dict[str, Any]:
              output = {
                  key: control[key]
                  for key in (
                      "tag",
                      "type",
                      "name",
                      "id",
                      "form_index",
                      "checked",
                      "disabled",
                      "value_present",
                  )
                  if key in control
              }
              if "value" in control:
                  output["value"] = control["value"]
              if "following_text" in control:
                  output["following_token"] = control["following_text"].split(" ", 1)[0]
              if "options" in control:
                  output["options"] = control["options"]
              return output


          def control_candidates(control: dict[str, Any]) -> set[str]:
              values = {
                  str(control.get("name", "")),
                  str(control.get("id", "")),
                  str(control.get("value", "")),
              }
              following = str(control.get("following_text", ""))
              if following:
                  values.add(following.split(" ", 1)[0])
              for option in control.get("options", []):
                  values.add(str(option.get("value", "")))
                  values.add(str(option.get("label", "")))
              return {normalize(value) for value in values if value}


          def all_strings(value: Any) -> list[str]:
              if isinstance(value, str):
                  return [value]
              if isinstance(value, list):
                  return [item for child in value for item in all_strings(child)]
              if isinstance(value, dict):
                  return [item for child in value.values() for item in all_strings(child)]
              return []


          started = time.monotonic()
          client = Client()
          pages: list[dict[str, Any]] = []
          bodies: dict[str, bytes] = {}
          result: dict[str, Any]
          try:
              for page_id, url in URLS:
                  metadata, body = client.get(url)
                  pages.append({"id": page_id, **metadata})
                  bodies[page_id] = body

              page_by_id = {page["id"]: page for page in pages}
              form_text = decode(
                  bodies["selected_form"], page_by_id["selected_form"]["content_type"]
              )
              parser = FormParser()
              parser.feed(form_text)
              form_page_url = page_by_id["selected_form"]["final_url"]

              field_resolution: dict[str, list[dict[str, Any]]] = {}
              for field in EXPECTED_FIELDS:
                  wanted = normalize(field)
                  matches = []
                  for control in parser.controls:
                      if wanted in control_candidates(control):
                          matches.append(safe_control(control))
                  field_resolution[field] = matches
              field_mapping_exact = all(
                  len(field_resolution[field]) == 1 for field in EXPECTED_FIELDS
              )
              mapped_form_indices = {
                  matches[0].get("form_index")
                  for matches in field_resolution.values()
                  if len(matches) == 1
              }
              one_form = (
                  field_mapping_exact
                  and len(mapped_form_indices) == 1
                  and None not in mapped_form_indices
              )
              selected_form_index = next(iter(mapped_form_indices)) if one_form else None
              selected_form = (
                  parser.forms[selected_form_index]
                  if selected_form_index is not None
                  else None
              )

              action_policy_ok = False
              safe_action: str | None = None
              action_reason = "NO_UNAMBIGUOUS_FORM"
              if selected_form is not None:
                  raw_action = html.unescape(selected_form.get("action", ""))
                  candidate_action = urljoin(form_page_url, raw_action)
                  try:
                      check_url(candidate_action)
                      safe_action = candidate_action
                      action_policy_ok = True
                      action_reason = "HTTPS_ALLOWLISTED"
                  except RuntimeError:
                      action_reason = "ACTION_URL_POLICY_REJECTED"

              year_matches: list[dict[str, str]] = []
              month_matches: list[dict[str, str]] = []
              default_extra: list[str] = []
              for control in parser.controls:
                  for option in control.get("options", []):
                      option_values = {
                          normalize(str(option.get("value", ""))),
                          normalize(str(option.get("label", ""))),
                      }
                      descriptor = {
                          "name": str(control.get("name", "")),
                          "id": str(control.get("id", "")),
                          "value": str(option.get("value", "")),
                          "label": str(option.get("label", "")),
                      }
                      if "2024" in option_values:
                          year_matches.append(descriptor)
                      if option_values.intersection({"1", "01", "jan", "january"}):
                          month_matches.append(descriptor)
                  if control.get("checked"):
                      value = str(control.get("value", ""))
                      if value and normalize(value) not in {
                          normalize(field) for field in EXPECTED_FIELDS
                      }:
                          default_extra.append(value[:256])

              selected_controls = [
                  safe_control(control)
                  for control in parser.controls
                  if control.get("form_index") == selected_form_index
              ]
              form_contract = {
                  "action": safe_action,
                  "action_policy_ok": action_policy_ok,
                  "action_reason": action_reason,
                  "method": selected_form.get("method") if selected_form else None,
                  "form_id": selected_form.get("id") if selected_form else None,
                  "form_name": selected_form.get("name") if selected_form else None,
                  "controls": selected_controls,
              }
              form_fingerprint = sha256(canonical(form_contract))
              page_lower = " ".join(parser.text_parts).lower()
              interaction = {
                  "login": any(value in page_lower for value in ("sign in", "log in", "login")),
                  "captcha": "captcha" in page_lower,
                  "manual": any(
                      value in page_lower
                      for value in ("manual verification", "human verification")
                  ),
                  "password_control": any(
                      control.get("type") == "password" for control in parser.controls
                  ),
              }
              form_ready = bool(
                  page_by_id["selected_form"]["status"] == 200
                  and field_mapping_exact
                  and one_form
                  and action_policy_ok
                  and selected_form
                  and selected_form.get("method") in {"GET", "POST"}
                  and len(year_matches) == 1
                  and len(month_matches) == 1
                  and not default_extra
                  and not any(interaction.values())
              )

              catalog_results: dict[str, dict[str, Any]] = {}
              for catalog_id in ("bts_flight_catalog", "marketing_catalog"):
                  payload = json.loads(bodies[catalog_id].decode("utf-8"))
                  catalog = payload.get("result") or {}
                  strings = all_strings(catalog)
                  lower_strings = [value.lower() for value in strings]
                  extras = {
                      str(item.get("key", "")).lower(): str(item.get("value", ""))
                      for item in catalog.get("extras", [])
                      if isinstance(item, dict)
                  }
                  urls = []
                  for value in strings:
                      if value.startswith("https://") or value.startswith("http://"):
                          urls.append(value)
                  transtats_urls = []
                  for value in urls:
                      parsed = urlsplit(value)
                      if parsed.scheme == "https" and (parsed.hostname or "").lower() in {
                          "transtats.bts.gov",
                          "www.transtats.bts.gov",
                      }:
                          transtats_urls.append(value)
                  license_url = str(catalog.get("license_url") or extras.get("license") or "")
                  license_parsed = urlsplit(license_url)
                  catalog_results[catalog_id] = {
                      "api_success": payload.get("success") is True,
                      "title": str(catalog.get("title", ""))[:256],
                      "access_public": (
                          extras.get("accesslevel", "").lower() == "public"
                          or any(value == "public" for value in lower_strings)
                      ),
                      "publisher_bts": any(
                          "bureau of transportation statistics" in value
                          for value in lower_strings
                      ),
                      "carrier_monthly_on_time": any(
                          "carrier monthly on time performance" in value.replace("on-time", "on time")
                          for value in lower_strings
                      ),
                      "transtats_distribution_urls": sorted(set(transtats_urls)),
                      "license_host": (license_parsed.hostname or "").lower(),
                      "license_path": license_parsed.path,
                      "license_government_works": (
                          license_parsed.scheme in {"http", "https"}
                          and (license_parsed.hostname or "").lower() in {"usa.gov", "www.usa.gov"}
                          and "government-works" in license_parsed.path
                      ),
                      "metadata_sha256": page_by_id[catalog_id]["sha256"],
                  }

              government_text = decode(
                  bodies["government_works"],
                  page_by_id["government_works"]["content_type"],
              ).lower()
              government_page_ok = bool(
                  page_by_id["government_works"]["status"] == 200
                  and "government works" in government_text
                  and "copyright" in government_text
              )
              primary = catalog_results["bts_flight_catalog"]
              corroboration = catalog_results["marketing_catalog"]
              rights_ready = bool(
                  primary["api_success"]
                  and primary["access_public"]
                  and primary["publisher_bts"]
                  and primary["carrier_monthly_on_time"]
                  and primary["transtats_distribution_urls"]
                  and primary["license_government_works"]
                  and government_page_ok
                  and corroboration["api_success"]
              )

              all_status_ok = all(page["status"] == 200 for page in pages)
              if not all_status_ok:
                  closed_result = "UPSTREAM_UNAVAILABLE"
                  reason_code = "OFFICIAL_DISCOVERY_GET_NOT_200"
              elif not form_ready:
                  closed_result = "CONTRACT_SOURCE_MISMATCH"
                  reason_code = "FORM_CONTRACT_NOT_EXACT_OR_ACTION_NOT_SAFE"
              elif not rights_ready:
                  closed_result = "RIGHTS_UNRESOLVED"
                  reason_code = "OFFICIAL_CATALOG_LICENSE_CHAIN_NOT_PROVEN"
              else:
                  closed_result = "DISCOVERY_READY_FOR_EXTRACT_PLANNING"
                  reason_code = "FORM_AND_RIGHTS_DISCOVERY_GATES_PASSED"

              result = {
                  "schema_version": 1,
                  "mode": "DISCOVERY",
                  "result": closed_result,
                  "reason_code": reason_code,
                  "runtime": {
                      "implementation": platform.python_implementation(),
                      "python": platform.python_version(),
                      "os": platform.system(),
                      "architecture": platform.machine(),
                  },
                  "request_policy": {
                      "method": "GET_ONLY",
                      "count": client.count,
                      "max": MAX_REQUESTS,
                      "redirect_count": client.redirects,
                      "redirect_max": MAX_REDIRECTS,
                      "minimum_interval_seconds": MIN_INTERVAL,
                      "connect_timeout_seconds": CONNECT_TIMEOUT,
                      "read_timeout_seconds": READ_TIMEOUT,
                      "elapsed_ms": round((time.monotonic() - started) * 1000),
                  },
                  "pages": pages,
                  "form": {
                      "ready": form_ready,
                      "field_mapping_exact": field_mapping_exact,
                      "field_resolution": field_resolution,
                      "mapped_to_one_form": one_form,
                      "selected_form_index": selected_form_index,
                      "action_policy_ok": action_policy_ok,
                      "action_reason": action_reason,
                      "action": safe_action,
                      "method": selected_form.get("method") if selected_form else None,
                      "year_2024_matches": year_matches,
                      "january_matches": month_matches,
                      "default_selected_extra": sorted(default_extra),
                      "interaction": interaction,
                      "contract_sha256": form_fingerprint,
                  },
                  "rights": {
                      "ready": rights_ready,
                      "primary_catalog": primary,
                      "marketing_corroboration": corroboration,
                      "government_works_page_ok": government_page_ok,
                      "local_analysis_with_attribution": rights_ready,
                      "raw_redistribution_enabled": False,
                  },
                  "extract": "NOT_RUN",
                  "artifact_count": 0,
                  "data_rows_read": 0,
                  "automatic_retry_count": 0,
              }
          except Exception as error:
              result = {
                  "schema_version": 1,
                  "mode": "DISCOVERY",
                  "result": "PROBE_SECURITY_ABORTED",
                  "reason_code": type(error).__name__ + ":" + str(error)[:160],
                  "runtime": {
                      "implementation": platform.python_implementation(),
                      "python": platform.python_version(),
                      "os": platform.system(),
                      "architecture": platform.machine(),
                  },
                  "request_policy": {
                      "method": "GET_ONLY",
                      "count": client.count,
                      "max": MAX_REQUESTS,
                      "redirect_count": client.redirects,
                      "redirect_max": MAX_REDIRECTS,
                      "elapsed_ms": round((time.monotonic() - started) * 1000),
                  },
                  "pages": pages,
                  "extract": "NOT_RUN",
                  "artifact_count": 0,
                  "data_rows_read": 0,
                  "automatic_retry_count": 0,
              }

          print(PREFIX + canonical(result).decode("utf-8"))
          PY
