in_scope:
  - fresh selected-field form GET and R2-compatible canonical fingerprint
  - fingerprint equality before POST
  - exact year 2024 and exact January selector
  - exact 15 checkbox controls in the contract order
  - exactly zero or one POST; no POST retry or replay
  - fresh in-memory same-host cookie continuity without value logging
  - at most one temporary ZIP file under the runner temporary directory
  - one safe non-encrypted regular CSV archive member
  - first CSV record read only through its terminating newline
  - byte-order-mark removal only; no trim rename reorder projection or coercion
  - exact ordered 15-column header equality
  - SHA-256 byte counts safe booleans and reason-code-only canonical result JSON
  - unconditional temporary ZIP cleanup on success and failure
  - temporary workflow removal result report and Foundation closeout evidence
out_of_scope:
  - any CSV data row read parse count sample or persistence
  - full CSV extraction decompression dataset ingestion or redistribution
  - any month other than January 2024 or any field outside exact 15
  - a second POST retry rerun or a second temporary ZIP
  - browser login CAPTCHA manual interaction or cookie export
  - dependency checkout action cache artifact secret OIDC environment
  - source test config data lock migration product implementation or PH2-T03
