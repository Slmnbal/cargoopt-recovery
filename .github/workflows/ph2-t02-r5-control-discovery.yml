name: PH2-T02-R5 Control Discovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ph2-t02-r5-control-discovery.yml

permissions: {}

concurrency:
  group: ph2-t02-r5-control-discovery
  cancel-in-progress: false

jobs:
  discovery:
    name: Read-only outside checked-control discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Run bounded standard-library discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import html
          import http.client
          import json
          import platform
          import re
          import ssl
          import time
          from html.parser import HTMLParser
          from typing import Any
          from urllib.parse import urljoin, urlsplit


          PREFIX = "PH2_T02_R5_RESULT_JSON="
          FORM_URL = (
              "https://www.transtats.bts.gov/"
              "DL_SelectFields.aspx?QO_fu146_anzr=b0-gvzr&gnoyr_VQ=FGJ"
          )
          EXPECTED_SHA256 = (
              "3d9227bf05af8dcf8f4fef99aef86ebbbcbe43561869ba43444079d913b3f8b0"
          )
          EXPECTED_FIELDS = [
              "FlightDate", "Reporting_Airline", "DOT_ID_Reporting_Airline",
              "Flight_Number_Reporting_Airline", "OriginAirportID", "Origin",
              "DestAirportID", "Dest", "CRSDepTime", "CRSArrTime",
              "CRSElapsedTime", "Distance", "Cancelled", "Diverted",
              "ArrDelayMinutes",
          ]
          ALLOWED_HOSTS = {"www.transtats.bts.gov", "transtats.bts.gov"}
          MAX_REQUESTS = 3
          MAX_REDIRECTS = 2
          MAX_BYTES = 8 * 1024 * 1024
          CONNECT_TIMEOUT = 10
          READ_TIMEOUT = 60
          MIN_INTERVAL = 1.0


          class ClosedError(Exception):
              def __init__(self, result: str, reason: str) -> None:
                  super().__init__(reason)
                  self.result = result
                  self.reason = reason


          def canonical(value: Any) -> bytes:
              return json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")


          def sha256(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()


          def normalize(value: str) -> str:
              return re.sub(r"[^a-z0-9]", "", value.lower())


          def check_url(url: str) -> str:
              parsed = urlsplit(url)
              host = (parsed.hostname or "").lower()
              if (
                  parsed.scheme != "https"
                  or host not in ALLOWED_HOSTS
                  or parsed.username
                  or parsed.password
                  or parsed.fragment
                  or parsed.port not in {None, 443}
              ):
                  raise ClosedError("PROBE_SECURITY_ABORTED", "URL_POLICY_VIOLATION")
              return host


          class Client:
              def __init__(self) -> None:
                  self.count = 0
                  self.redirects = 0
                  self.last_at: float | None = None
                  self.context = ssl.create_default_context()

              def get(self, requested_url: str) -> tuple[dict[str, Any], bytes]:
                  current = requested_url
                  started = time.monotonic()
                  while True:
                      if self.count >= MAX_REQUESTS:
                          raise ClosedError("PROBE_SECURITY_ABORTED", "REQUEST_BUDGET_EXCEEDED")
                      host = check_url(current)
                      parsed = urlsplit(current)
                      target = parsed.path or "/"
                      if parsed.query:
                          target += "?" + parsed.query
                      now = time.monotonic()
                      if self.last_at is not None:
                          remaining = MIN_INTERVAL - (now - self.last_at)
                          if remaining > 0:
                              time.sleep(remaining)
                      self.last_at = time.monotonic()
                      self.count += 1
                      connection = http.client.HTTPSConnection(
                          host, parsed.port or 443, timeout=CONNECT_TIMEOUT,
                          context=self.context,
                      )
                      try:
                          connection.request(
                              "GET", target,
                              headers={
                                  "Accept": "text/html,application/xhtml+xml",
                                  "Accept-Encoding": "identity",
                                  "User-Agent": "CargoOptRecovery-PH2-T02-R5/1.0",
                              },
                          )
                          response = connection.getresponse()
                          if connection.sock is not None:
                              connection.sock.settimeout(READ_TIMEOUT)
                          if response.status in {301, 302, 303, 307, 308}:
                              location = response.getheader("Location")
                              if not location:
                                  raise ClosedError("UPSTREAM_UNAVAILABLE", "REDIRECT_WITHOUT_LOCATION")
                              self.redirects += 1
                              if self.redirects > MAX_REDIRECTS:
                                  raise ClosedError("PROBE_SECURITY_ABORTED", "REDIRECT_BUDGET_EXCEEDED")
                              current = urljoin(current, location)
                              check_url(current)
                              continue
                          if response.status != 200:
                              raise ClosedError("UPSTREAM_UNAVAILABLE", "FORM_GET_NOT_200")
                          body = bytearray()
                          while True:
                              chunk = response.read(65536)
                              if not chunk:
                                  break
                              body.extend(chunk)
                              if len(body) > MAX_BYTES:
                                  raise ClosedError("PROBE_SECURITY_ABORTED", "FORM_BYTE_LIMIT_EXCEEDED")
                          raw = bytes(body)
                          return {
                              "status": response.status,
                              "final_url": current,
                              "content_type": response.getheader("Content-Type"),
                              "byte_count": len(raw),
                              "sha256": sha256(raw),
                              "elapsed_ms": round((time.monotonic() - started) * 1000),
                          }, raw
                      finally:
                          connection.close()


          class FormParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.forms: list[dict[str, Any]] = []
                  self.form_stack: list[int] = []
                  self.controls: list[dict[str, Any]] = []
                  self.current_select: dict[str, Any] | None = None
                  self.current_option: dict[str, Any] | None = None
                  self.last_visible_control: dict[str, Any] | None = None
                  self.text_parts: list[str] = []
                  self.current_label: dict[str, str] | None = None
                  self.labels: list[dict[str, str]] = []

              @staticmethod
              def attrs(attrs: list[tuple[str, str | None]]) -> dict[str, str]:
                  return {key.lower(): value or "" for key, value in attrs}

              @property
              def form_index(self) -> int | None:
                  return self.form_stack[-1] if self.form_stack else None

              def handle_starttag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  tag = tag.lower()
                  values = self.attrs(attrs)
                  if tag == "form":
                      index = len(self.forms)
                      self.forms.append({
                          "index": index, "action": values.get("action", ""),
                          "method": values.get("method", "get").upper(),
                          "id": values.get("id", ""), "name": values.get("name", ""),
                      })
                      self.form_stack.append(index)
                      self.last_visible_control = None
                  elif tag == "input":
                      control_type = values.get("type", "text").lower()
                      control: dict[str, Any] = {
                          "tag": "input", "type": control_type,
                          "name": values.get("name", ""), "id": values.get("id", ""),
                          "form_index": self.form_index, "checked": "checked" in values,
                          "disabled": "disabled" in values, "following_text": "",
                      }
                      raw_value = values.get("value", "")
                      if control_type == "hidden":
                          control["value_present"] = bool(raw_value)
                      elif control_type in {"checkbox", "radio", "submit", "button"}:
                          control["value"] = raw_value[:256]
                      self.controls.append(control)
                      self.last_visible_control = control if control_type in {"checkbox", "radio"} else None
                  elif tag == "select":
                      self.current_select = {
                          "tag": "select", "type": "select",
                          "name": values.get("name", ""), "id": values.get("id", ""),
                          "form_index": self.form_index, "disabled": "disabled" in values,
                          "options": [],
                      }
                      self.controls.append(self.current_select)
                      self.last_visible_control = None
                  elif tag == "option" and self.current_select is not None:
                      self.current_option = {
                          "value": values.get("value", "")[:256], "label": "",
                          "selected": "selected" in values, "disabled": "disabled" in values,
                      }
                      self.current_select["options"].append(self.current_option)
                  elif tag == "label":
                      self.current_label = {"for": values.get("for", "")[:256], "text": ""}
                      self.labels.append(self.current_label)

              def handle_startendtag(self, tag: str, attrs: list[tuple[str, str | None]]) -> None:
                  self.handle_starttag(tag, attrs)

              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if tag == "form" and self.form_stack:
                      self.form_stack.pop()
                      self.last_visible_control = None
                  elif tag == "select":
                      self.current_select = None
                  elif tag == "option":
                      self.current_option = None
                  elif tag == "label":
                      self.current_label = None

              def handle_data(self, data: str) -> None:
                  compact = " ".join(data.split())
                  if not compact:
                      return
                  self.text_parts.append(compact)
                  if self.current_option is not None:
                      self.current_option["label"] = (
                          self.current_option["label"] + " " + compact
                      ).strip()[:256]
                  elif self.last_visible_control is not None:
                      self.last_visible_control["following_text"] = (
                          self.last_visible_control["following_text"] + " " + compact
                      ).strip()[:512]
                  if self.current_label is not None:
                      self.current_label["text"] = (
                          self.current_label["text"] + " " + compact
                      ).strip()[:256]


          def decode(raw: bytes, content_type: str | None) -> str:
              match = re.search(r"charset=([A-Za-z0-9._-]+)", content_type or "", re.I)
              charset = match.group(1) if match else "utf-8"
              try:
                  return raw.decode(charset, errors="replace")
              except LookupError:
                  return raw.decode("utf-8", errors="replace")


          def safe_control(control: dict[str, Any]) -> dict[str, Any]:
              output = {
                  key: control[key]
                  for key in (
                      "tag", "type", "name", "id", "form_index", "checked",
                      "disabled", "value_present",
                  )
                  if key in control
              }
              if "value" in control:
                  output["value"] = control["value"]
              if "following_text" in control:
                  output["following_token"] = control["following_text"].split(" ", 1)[0]
              if "options" in control:
                  output["options"] = control["options"]
              return output


          def control_candidates(control: dict[str, Any]) -> set[str]:
              values = {
                  str(control.get("name", "")), str(control.get("id", "")),
                  str(control.get("value", "")),
              }
              following = str(control.get("following_text", ""))
              if following:
                  values.add(following.split(" ", 1)[0])
              for option in control.get("options", []):
                  values.add(str(option.get("value", "")))
                  values.add(str(option.get("label", "")))
              return {normalize(value) for value in values if value}


          def label_for(parser: FormParser, control: dict[str, Any]) -> str:
              control_id = str(control.get("id", ""))
              matches = [item["text"] for item in parser.labels if control_id and item["for"] == control_id]
              return matches[0] if len(matches) == 1 else ""


          started = time.monotonic()
          client = Client()
          page: dict[str, Any] | None = None
          fingerprint: str | None = None
          outside: list[dict[str, Any]] = []
          result_name = "PROBE_SECURITY_ABORTED"
          reason_code = "UNEXPECTED_INTERNAL_EXCEPTION"
          try:
              page, raw = client.get(FORM_URL)
              parser = FormParser()
              parser.feed(decode(raw, page["content_type"]))
              resolution: dict[str, list[int]] = {}
              for field in EXPECTED_FIELDS:
                  wanted = normalize(field)
                  resolution[field] = [
                      index for index, control in enumerate(parser.controls)
                      if wanted in control_candidates(control)
                  ]
              if not all(len(resolution[field]) == 1 for field in EXPECTED_FIELDS):
                  raise ClosedError("CONTROL_NOT_UNAMBIGUOUS", "EXACT_15_MAPPING_FAILED")
              mapped = [resolution[field][0] for field in EXPECTED_FIELDS]
              if len(set(mapped)) != 15:
                  raise ClosedError("CONTROL_NOT_UNAMBIGUOUS", "EXACT_15_NOT_ONE_TO_ONE")
              form_indices = {parser.controls[index].get("form_index") for index in mapped}
              if len(form_indices) != 1 or None in form_indices:
                  raise ClosedError("CONTROL_NOT_UNAMBIGUOUS", "EXACT_15_NOT_ONE_FORM")
              selected_index = next(iter(form_indices))
              selected_form = parser.forms[selected_index]
              action = urljoin(page["final_url"], html.unescape(selected_form["action"]))
              check_url(action)
              selected_controls = [
                  safe_control(control) for control in parser.controls
                  if control.get("form_index") == selected_index
              ]
              form_contract = {
                  "action": action, "action_policy_ok": True,
                  "action_reason": "HTTPS_ALLOWLISTED", "method": selected_form["method"],
                  "form_id": selected_form["id"], "form_name": selected_form["name"],
                  "controls": selected_controls,
              }
              fingerprint = sha256(canonical(form_contract))
              if fingerprint != EXPECTED_SHA256:
                  raise ClosedError("CONTROL_NOT_UNAMBIGUOUS", "FRESH_FINGERPRINT_MISMATCH")
              mapped_set = set(mapped)
              field_names = sorted({str(parser.controls[index].get("name", "")) for index in mapped})
              for index, control in enumerate(parser.controls):
                  if (
                      control.get("form_index") == selected_index
                      and control.get("type") in {"checkbox", "radio"}
                      and control.get("checked")
                      and index not in mapped_set
                  ):
                      safe = safe_control(control)
                      outside.append({
                          "control_index": index,
                          "type": safe.get("type", ""),
                          "name": safe.get("name", ""),
                          "id": safe.get("id", ""),
                          "value": safe.get("value", ""),
                          "following_token": safe.get("following_token", ""),
                          "label": label_for(parser, control),
                          "disabled": safe.get("disabled", False),
                          "same_name_as_field_selector": safe.get("name", "") in field_names,
                          "normalized_candidates": sorted(control_candidates(control)),
                      })
              if len(outside) == 1:
                  result_name = "CONTROL_IDENTIFIED"
                  reason_code = "EXACTLY_ONE_OUTSIDE_CHECKED_CONTROL_IDENTIFIED"
              else:
                  result_name = "CONTROL_NOT_UNAMBIGUOUS"
                  reason_code = "OUTSIDE_CHECKED_CONTROL_COUNT_NOT_ONE"
          except ClosedError as error:
              result_name = error.result
              reason_code = error.reason
          except Exception:
              result_name = "PROBE_SECURITY_ABORTED"
              reason_code = "UNEXPECTED_INTERNAL_EXCEPTION"

          result = {
              "schema_version": 1,
              "mode": "READ_ONLY_CONTROL_DISCOVERY",
              "result": result_name,
              "reason_code": reason_code,
              "runtime": {
                  "implementation": platform.python_implementation(),
                  "python": platform.python_version(), "os": platform.system(),
                  "architecture": platform.machine(),
              },
              "request_policy": {
                  "method": "GET_ONLY", "count": client.count, "max": MAX_REQUESTS,
                  "redirect_count": client.redirects, "redirect_max": MAX_REDIRECTS,
                  "automatic_retry_count": 0,
                  "elapsed_ms": round((time.monotonic() - started) * 1000),
              },
              "form": {
                  "response": page, "contract_sha256": fingerprint,
                  "expected_contract_sha256": EXPECTED_SHA256,
                  "contract_exact": fingerprint == EXPECTED_SHA256,
                  "mapped_field_count": 15,
              },
              "outside_checked_controls": outside,
              "outside_checked_control_count": len(outside),
              "post_count": 0,
              "temporary_zip_count": 0,
              "header_records_read": 0,
              "data_rows_read": 0,
              "artifact_count": 0,
              "hidden_values_logged": False,
              "cookie_values_logged": False,
              "response_body_logged": False,
          }
          print(PREFIX + canonical(result).decode("utf-8"))
          PY
