acceptance_criteria:
  - roster yalnızca schedule ve pre-outcome eligibility ile seçilmeli
  - roster toplamda en fazla 300 ve destinasyon başına en fazla 30 case içermeli
  - roster sıralaması exact deterministic SHA-256 materyaliyle tanımlanmalı
  - walk-forward as-of history ile evaluation outcome reveal yetkileri ayrılmalı
  - her roster case için üç strateji full outcome reveal öncesi tamamlanmalı
  - triggered cohort yalnızca reveal sonrası source severe disruption ile kurulmalı
  - alert model precision recall veya end-to-end trigger başarısı iddia edilmemeli
  - realized cost cost-policy-try-v1 ile integer kuruş olarak yeniden hesaplanmalı
  - primary karşılaştırma ML-informed eksi risk-blind paired maliyet farkı olmalı
  - bootstrap source FlightDate cluster ile 10000 tekrar ve seed 20240831 kullanmalı
  - positive release için örnek büyüklüğü kapsama optimalite etki ve CI kapıları birlikte geçmeli
  - yetersiz nötr veya negatif sonuç proje başarısızlığı olarak etiketlenmemeli
  - invalid experiment ile insufficient evidence birbirinden ayrılmalı
  - PHASE_1 ile PHASE_8 kilitli kalmalı
  - kapsam dışı dosya dependency implementation veya outcome artifact oluşmamalı
tests_required:
  - bütün YAML dosyaları safe parser ile parse edilebilmeli
  - tam bir ACTIVE faz bulunmalı ve bu PHASE_0 olmalı
  - roster hash material ve no-backfill kuralı exact tanımlı olmalı
  - evaluation runner ile as-of feature builder outcome yetkileri çelişmemeli
  - freeze manifest bütün pre-reveal artifact ailelerini kapsamalı
  - post-reveal tuning ve primary rerun yasak olmalı
  - üç strateji ve pairing denominator kuralları belgeler arasında eşleşmeli
  - realized cost formülü COST_MODEL_CONTRACT ile birebir eşleşmeli
  - primary difference işaret yönü ve relative improvement formülü exact olmalı
  - bootstrap draw quantile ve cluster ağırlıklandırma algoritması deterministic olmalı
  - output schema required alanları benzersiz ve contractlarla uyumlu olmalı
  - release kapısı bütün eşikleri aynı denominator semantiğiyle tanımlamalı
  - invalid neutral negative insufficient ve adopt kararları tutarlı olmalı
  - onaylı mevcut ve yeni dosyalar dışında dosya oluşmamalı
  - implementation dependency database UI ve locked-phase yolları bulunmamalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
dependencies_allowed: false
migrations_allowed: false
stop_conditions:
  - roster seçiminin source veya candidate outcome'a bağlı hale gelmesi
  - Aralık outcome'unun freeze ve reveal kapısından önce evaluation runner'a açılması
  - as-of feature builder'ın availability kuralını aşması
  - üç stratejinin farklı case input shipment candidate veya cost snapshot kullanması
  - realized cost'un dondurulmuş cost policy'den ayrışması
  - missing case'in sessizce denominator dışına atılması
  - sonuç görüldükten sonra threshold bootstrap maliyet veya model değiştirilmesi
  - değerlendirme iddiasının alert prediction ya da nedensel etkiye genişletilmesi
  - onaylı dosya dışında değişiklik dependency implementation veri veya solver gereksinimi
  - mevcut kullanıcı dosyalarıyla çakışma
