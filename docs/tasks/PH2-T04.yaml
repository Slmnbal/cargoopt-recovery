in_scope:
  - immutable request specification with secret-header rejection and body fingerprint
  - exact scheme host port URL and final-URL validation
  - same-policy redirect validation and bounded redirect count
  - automatic retry for idempotent GET or HEAD only
  - zero automatic retry for POST
  - retryable HTTP status and transport error classification
  - bounded request body response body chunk and total attempts
  - content type encoding content-length and final byte-count validation
  - streaming SHA-256 into a same-directory temporary file
  - atomic hard-link no-overwrite publish and unconditional temporary cleanup
  - ZIP member count name traversal symlink encryption size ratio and CRC gates
  - exact physical header validation without fuzzy rename projection or coercion
  - canonical manifest bytes hash and immutable same-ID conflict detection
  - production acquisition config for exact 2024 dataset and 15 physical fields
  - fixture-only local HTTP integration and synthetic ZIP tests
  - data root Git ignore policy without creating the data directory

out_of_scope:
  - any request to BTS or another external network host
  - January or full-year ZIP CSV row download or persistence
  - dynamic BTS HTML form parsing or actual POST payload construction
  - staging type parsing row validation quarantine duplicate or quality engine
  - timezone processing schedule outcome split universe feature or domain code
  - CLI API UI database migration container deployment or scheduler
  - dependency version lock workflow or accepted contract mutation
  - secret cookie token anti-CSRF or raw response byte logging
  - PH2-T05 or later file placeholder adapter interface or TODO

