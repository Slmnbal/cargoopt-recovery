schema_version: 1
task_id: PH0-T05
phase: PHASE_0
status: COMPLETED
approved_at: "2026-08-13"
completed_at: "2026-08-13"
approval_source: explicit_user_approval
goal: >-
  Aralık 2024 blind replay roster'ını outcome görmeden dondurmak, aynı
  recovery case üzerinde greedy, risk-blind MILP ve ML-informed MILP
  stratejilerinin gerçekleşen sentetik maliyetini paired biçimde ölçmek ve
  ML-informed politikanın benimsenme kararını önceden kayıtlı istatistiksel
  kapılara bağlamak.
in_scope:
  - outcome-blind source case roster ve destinasyon kotası
  - deterministic SHA-256 case sıralama ve seçim kuralı
  - point-in-time walk-forward feature outcome erişim sınırı
  - prediction OR input plan execution validation ve değerlendirme artifact freeze
  - full outcome reveal öncesi üç stratejinin çalıştırılma zorunluluğu
  - source severe disruption sonrası triggered cohort tanımı
  - exogenous alert koşullu karar katkısı iddia sınırı
  - candidate outcome ile realized synthetic TRY cost hesabı
  - paired case completeness ve missingness politikası
  - source FlightDate cluster bootstrap prosedürü
  - primary ve secondary metric tanımları
  - experiment integrity evidence ve policy release kapıları
  - evaluation run output schema ve karar status enum'ları
out_of_scope:
  - Python evaluation veya bootstrap implementation
  - BTS verisi indirmek ya da Aralık outcome açmak
  - feature prediction generator model veya solver çalıştırmak
  - model fit calibration tuning veya threshold seçimi
  - cost capacity veya farklı senaryo sensitivity grid'i tanımlamak
  - database migration API frontend veya dashboard
  - pyproject.toml uv.lock veya dependency değişikliği
  - Phase 1 ile Phase 8 implementation hazırlığı
  - RAG LLM Hugging Face pgvector veya Ollama
files_allowed:
  - PROJECT_SPEC.md
  - docs/phase-status.yaml
  - docs/tasks/PH0-T05.yaml
