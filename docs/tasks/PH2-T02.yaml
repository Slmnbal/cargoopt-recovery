network_policy:
  allowed_only_after_execution_approval: true
  tls_verification: REQUIRED_DEFAULT_TRUST_STORE
  schemes: [https]
  hosts:
    - transtats.bts.gov
    - www.transtats.bts.gov
    - bts.gov
    - www.bts.gov
    - ntl.bts.gov
    - transportation.gov
    - www.transportation.gov
  fixed_entry_urls:
    - https://www.transtats.bts.gov/ontime/
    - https://transtats.bts.gov/DatabaseInfo.asp?QO_VQ=EFD
    - https://www.transtats.bts.gov/Fields.asp?gnoyr_VQ=FGJ
    - https://www.transtats.bts.gov/DL_SelectFields.aspx?QO_fu146_anzr=b0-gvzr&gnoyr_VQ=FGJ
    - https://transtats.bts.gov/PREZIP/
    - https://ntl.bts.gov/ntl/public-access/managing-rights
  methods:
    HEAD: ALLOWED_FOR_METADATA
    GET: ALLOWED
    POST: ALLOWED_ONLY_TO_DISCOVERED_OFFICIAL_SELECTED_FIELD_FORM_ACTION
  concurrency: 1
  max_total_requests: 12
  minimum_interval_seconds: 1
  max_redirects: 5
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  max_total_execution_seconds: 600
  retries:
    max_additional_attempts: 2
    allowed_for: [HEAD, GET]
    retry_statuses: [429, 500, 502, 503, 504]
    post_automatic_retry: false
    retry_after_max_seconds: 30
  proxy_policy: DISABLE_ENVIRONMENT_PROXIES
  authentication: FORBIDDEN
  persistent_cookie_jar: FORBIDDEN
  session_cookie_scope: MEMORY_ONLY_SINGLE_EXECUTION
  user_agent: CargoOpt-Recovery-source-compatibility-probe/1
  redirect_rule: REVALIDATE_HTTPS_AND_HOST_AFTER_EVERY_REDIRECT
bounded_artifact_policy:
  allowed_only_after_execution_approval: true
  target_period: "2024-01"
  max_artifact_count: 1
  max_compressed_bytes: 268435456
  max_archive_members: 1
  max_declared_uncompressed_member_bytes: 2147483648
  max_header_read_bytes: 1048576
  data_rows_read: 0
  expected_member_type: SINGLE_REGULAR_UNENCRYPTED_CSV
  expected_content_types:
    - application/zip
    - application/x-zip-compressed
    - application/octet-stream
  storage: OS_TEMPORARY_DIRECTORY_OUTSIDE_REPOSITORY
  persistent_raw_or_csv_bytes: FORBIDDEN
  cleanup: REQUIRED_ON_SUCCESS_FAILURE_AND_INTERRUPTION
  cleanup_evidence: TEMPORARY_PATH_ABSENT_AFTER_PROBE
transient_execution_files:
  allowed_outside_repository:
    - ephemeral Python standard-library probe script
    - in-memory HTML form and cookie state
    - at most one bounded January 2024 archive or selected-field equivalent
    - at most one bounded header buffer
    - temporary stdout and error log without cookie or anti-CSRF values
  persistence_rule: DELETE_BEFORE_TASK_RESULT_IS_COMMITTED
  secret_redaction:
    - do not persist cookie values
    - do not persist anti-CSRF values
    - record only field names presence and one-way content fingerprints when necessary
probe_sequence:
  - revalidate current main commit Phase 2 gate and task execution approval
  - create OS temporary directory and register cleanup guard
  - fetch official profile field dictionary PREZIP index and rights pages with fixed URLs
  - fetch selected-field page and record form structure without persisting token or cookie values
  - construct exact 2024 January 15-field request from discovered official form controls
  - if deterministic public form request is impossible do not use browser automation and set CONTRACT_SOURCE_MISMATCH
  - spend the single artifact budget on selected-field output when possible otherwise optionally on January PREZIP header confirmation
  - validate every redirect response size archive member and bounded CSV header fail-closed
  - compare parsed header names and order with expected_selected_columns_exact_order
  - determine rights decision only from official source text and project local-use/no-redistribution policy
  - delete every transient byte and verify temporary path absence
  - write report and update task phase and project status without creating PH2-T03
success_contract:
  result: SOURCE_COMPATIBLE
  required_all:
    - official source identity and January 2024 filter are unambiguous
    - public request can be reconstructed from recorded form structure without authentication manual browser CAPTCHA or reusable secret
    - selected output contains exactly one regular unencrypted CSV member
    - parsed CSV header exactly equals expected 15 names in expected order
    - request response redirect and archive metadata are completely recorded
    - official terms are sufficient for local analysis with attribution while raw redistribution remains disabled
    - all transient page session archive and header bytes are deleted
  phase_result:
    phase_2_status: ACTIVE
    phase_2_gate: PH2_T02_RESULT_READY_FOR_HUMAN_APPROVAL
    active_task: null
  next_task_rule: PH2_T03_MAY_ONLY_BE_PLANNED_AFTER_SEPARATE_RESULT_APPROVAL
failure_contracts:
  CONTRACT_SOURCE_MISMATCH:
    examples:
      - only full-width source is scriptable
      - selected-field interface cannot be reconstructed deterministically
      - header is missing extra reordered duplicated or renamed
      - output requires manual browser CAPTCHA login or reusable session state
    action: STOP_AND_REQUIRE_SEPARATE_GOVERNANCE_DECISION
  RIGHTS_UNRESOLVED:
    examples:
      - official terms cannot support local processing decision
      - exact rights claim would require inference from a third-party source
    action: STOP_WITHOUT_PERSISTENT_DATA_OR_NEXT_TASK
  UPSTREAM_UNAVAILABLE:
    examples:
      - bounded retries end without an official response
      - official page or form contract cannot be reached within time and request bounds
    action: STOP_WITHOUT_MIRROR_FALLBACK
  PROBE_SECURITY_ABORTED:
    examples:
      - redirect leaves allowlisted HTTPS hosts
      - byte member time or request limit is exceeded
      - encrypted multiple unsafe or ambiguous archive member is observed
    action: DELETE_TRANSIENT_BYTES_AND_STOP
acceptance_criteria:
  - execution başlamadan exact execution approval task içinde kaydedilmiş olmalı
  - yalnız network_policy içindeki resmî HTTPS host ve method sınırı kullanılmalı
  - fixed input January 2024 ve exact 15 field olmalı
  - en fazla bir bounded source artifact geçici olarak alınmalı
  - hiçbir data row okunmamalı veya parse edilmemeli
  - header karşılaştırması BOM dışında fuzzy rename trim reorder projection veya coercion yapmamalı
  - request ve response provenance URL redirect method status headers byte count ve SHA-256 ile kaydedilmeli
  - rights kararı official source claim'i ile local processing ve raw redistribution sınırını ayrı yazmalı
  - result success_contract veya failure_contracts içindeki tek bir closed status olmalı
  - report raw data cookie token anti-CSRF değeri veya local absolute path içermemeli
  - temporary path probe sonunda mevcut olmamalı
  - dependency lock source tests config workflow data artifact migration ve Phase 3+ dosyası değişmemeli
  - PH2-T03 task veya placeholder oluşturulmamalı
  - yalnız exact files_allowed repository içinde değişmeli
tests_required:
  - bütün repository YAML dosyaları safe parser ile parse edilebilmeli
  - task phase ve project state tek ACTIVE phase ve tutarlı active_task taşımalı
  - official URL scheme host ve redirect chain allowlist doğrulaması geçmeli
  - request count timeout retry byte member ve header read sınırları raporda kanıtlanmalı
  - archive member regular unencrypted single CSV olmalı
  - raw ve parsed header evidence exact 15 field equality sonucunu taşımalı
  - no-data-row-read invariant'i kanıtlanmalı
  - cleanup guard success failure ve interruption yolunda temporary path bırakmamalı
  - report yalnız official source URL'leri claim ve accessed_at kaydı içermeli
  - pyproject.toml uv.lock source tests configs workflow ve accepted contracts byte-identical kalmalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
  - current main commit hosted Foundation workflow'unda success olmalı
