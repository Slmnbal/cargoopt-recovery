schema_version: 1
task_id: PH0-T04
phase: PHASE_0
status: COMPLETED
approved_at: "2026-08-13"
completed_at: "2026-08-13"
approval_source: explicit_user_approval
goal: >-
  Risk-blind ve ML-informed MILP formülünü, deterministic greedy baseline'ı,
  HiGHS execution/status davranışını ve solver state'inden bağımsız plan
  validation sözleşmesini uygulama kodundan önce kesinleştirmek.
in_scope:
  - shipment candidate ve eligibility setlerinin matematiksel tanımı
  - binary assignment ve unassigned karar değişkenleri
  - exactly-one weight volume ve eligibility constraint'leri
  - risk-blind ve ML-informed objective formülleri
  - tam sayı kuruş cost coefficient politikası
  - deterministic greedy risk-blind baseline algoritması
  - primary objective koruyan secondary tie-break protokolü
  - HiGHS 60 saniye time limit ve 0.001 relative MIP gap
  - OPTIMAL FEASIBLE_TIMEOUT INFEASIBLE NO_SOLUTION_TIMEOUT ERROR durumları
  - incumbent dual bound gap ve runtime raporlama
  - no-plan durumlarında assignment yayımlama yasağı
  - Pyomo ve solver state'inden bağımsız validator sorumluluğu
  - schema hash assignment capacity eligibility ve cost doğrulamaları
  - plan solver execution ve validation output schema
out_of_scope:
  - Python Pyomo veya validator implementation
  - HiGHS veya başka dependency kurulumu
  - pyproject.toml veya lock file
  - optimizasyon veya benchmark çalıştırmak
  - sentetik veri üretmek veya BTS indirmek
  - database migration API frontend
  - blind replay case seçimi istatistik veya release kararı
  - RAG LLM Hugging Face pgvector veya Ollama
