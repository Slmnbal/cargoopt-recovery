  - workflow structure and standard-library AST scan passes
  - synthetic parser redaction ZIP header and cleanup self-tests pass
  - exact-four-before-POST invariant and result schema pass offline
  - immutable foundation dependency lock source tests and R4/R5 evidence retain hashes
  - temporary workflow removal is proven by remote 404
  - final Foundation closeout run passes with zero artifacts
dependencies_allowed: false
migrations_allowed: false
product_implementation_allowed: false
extract_allowed: true
persistent_data_allowed: false
automatic_rerun_allowed: false
stop_conditions:
