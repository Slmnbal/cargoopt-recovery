acceptance_criteria:
  - yalnız official primary source veya canonical package metadata kullanılmalı
  - her kaynak URL erişim tarihi desteklediği claim ve kullanım koşuluyla kaydedilmeli
  - her tool/dependency adayı için exact version uyumluluk lisans maintenance security transitive impact ve removal cost bulunmalı
  - ücretsiz local CPU-first yol managed servis gerektirmeden tanımlanmalı
  - veri acquisition ile offline transform ve test sınırı açık olmalı
  - raw byte provenance ve immutable manifest fail-closed tasarlanmalı
  - schedule input ile outcome label alanları ayrı trust zone olarak planlanmalı
  - leakage testleri T-24 T-18 T-12 T-6 cutoff'larını kapsamalı
  - generator determinism seed config version sort tie-break ve byte hash ile tanımlanmalı
  - sonraki her görev bounded sorumluluk exact allowlist precondition test ve stop condition taşımalı
  - hiçbir dependency data implementation ya da placeholder artifact'ı oluşmamalı
tests_required:
  - bütün yeni YAML dosyaları safe parser ile parse edilebilmeli
  - research source'ları official domain veya canonical package metadata olmalı
  - candidate version alanları exact olmalı latest range pre-release yanked veya Git branch olmamalı
  - seçilen adayların CPython 3.14.7 ve Linux x86_64 CPU-only uyumu kanıtlanmalı
  - proposed dependency graph lisans ve vulnerability kontrol planı taşımalı
  - implementation plan contract dependency sırasına uymalı
  - hiçbir görev bir sonraki görev dosyasını onaysız oluşturmamalı
  - onaylı exact files_allowed dışında dosya değişmemeli
  - dependency lock data source test workflow ve migration mutation'ı olmamalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
