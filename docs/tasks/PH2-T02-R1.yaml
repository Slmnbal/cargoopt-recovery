    - https://transtats.bts.gov/DatabaseInfo.asp?QO_VQ=EFD
    - https://www.transtats.bts.gov/Fields.asp?gnoyr_VQ=FGJ
    - https://www.transtats.bts.gov/DL_SelectFields.aspx?QO_fu146_anzr=b0-gvzr&gnoyr_VQ=FGJ
    - https://transtats.bts.gov/PREZIP/
    - https://ntl.bts.gov/ntl/public-access/managing-rights
  methods:
    GET: ALLOWED
    POST: ALLOWED_ONLY_IN_EXTRACT_TO_DISCOVERED_EXACT_FORM_ACTION
    HEAD: NOT_REQUIRED
  max_total_requests_across_both_runs: 12
  discovery_max_requests: 7
  extract_max_requests: 5
  minimum_interval_seconds: 1
  max_redirects_per_run: 5
  connect_timeout_seconds: 10
  read_timeout_seconds: 60
  max_execution_seconds_per_run: 600
  discovery_retries:
    max_global_additional_get_attempts: 1
    statuses: [429, 500, 502, 503, 504]
  extract_retries:
    fresh_form_get_additional_attempts: 1
    post_automatic_retry: false
  redirect_rule: REVALIDATE_HTTPS_AND_HOST_AND_COUNT_EVERY_REDIRECT
  platform_control_plane_note: >-
    GitHub runner provisioning ve log control-plane trafiği probe script'i
    tarafından başlatılmaz ve BTS request bütçesine dahil değildir; probe
    workflow'u checkout veya action download yapmaz.
discovery_stage:
  mode: DISCOVERY
  mutations: GET_ONLY
  required_outputs:
    - runner OS architecture and exact Python version
    - request count elapsed time and redirect chains
    - per-page requested URL final URL status content type length ETag Last-Modified byte count and SHA-256
    - selected form action method and HTTPS allowlist result
    - control tag type name id and non-secret option mapping
    - hidden control names and value SHA-256 only with no raw values
    - authentication CAPTCHA manual interaction and reusable-state requirements
    - exact 2024 January option resolution
    - exact ordered 15-field control resolution
    - canonical form contract SHA-256 excluding ephemeral token values
    - official rights source decision
  ready_for_extract_requires_all:
    - every response and redirect remains on allowlisted HTTPS hosts
    - selected-field form is public and no login CAPTCHA browser or user cookie is required
    - action method and all required controls are unambiguous
    - year 2024 month January and every exact field map one-to-one
    - no extra selected field is required or default-selected
    - rights status is VERIFIED_LOCAL_ANALYSIS_WITH_ATTRIBUTION_RAW_REDISTRIBUTION_DISABLED
  otherwise: EMIT_ONE_CLOSED_RESULT_AND_SKIP_EXTRACT
discovery_review_gate:
  automatic_progression: false
  required_review:
    - fetch workflow run job and sanitized log by exact head SHA
    - validate result JSON schema offline
    - verify request count and redirects against policy
    - recompute canonical form contract fingerprint
    - verify no hidden cookie token anti-CSRF or absolute temp path value appears
    - verify concurrent probe jobs did not occur
  extract_workflow_update_allowed_only_if: discovery_stage.ready_for_extract_requires_all
  separate_human_approval_between_stages: false
  rationale: >-
    İnsan yürütme onayı iki aşamalı state machine'i birlikte kapsar; discovery
    başarısızsa extract oluşturulmaz. Extract geçişi yalnız önceden tanımlanmış
    mekanik kapılara bağlıdır ve scope genişletmez.
extract_stage:
  mode: EXTRACT
  preconditions:
    - discovery workflow and Foundation workflow both concluded success
    - sanitized discovery result status is READY_FOR_EXTRACT
    - embedded discovery form contract SHA-256 matches reviewed value
  sequence:
    - open a fresh in-memory cookie jar and fetch selected-field form
    - recompute non-secret form contract and require exact discovery fingerprint equality
    - resolve fresh hidden values only in memory without logging
    - construct fixed 2024 January exact ordered 15-field request
    - compute a canonical request fingerprint excluding cookie and hidden values
    - send one non-retried POST or GET only to the discovered official action
    - stream at most one ZIP into runner temporary storage with SHA-256 and byte cap
    - validate one regular unencrypted CSV member and declared expanded size
    - read at most BOM plus one CSV header line and zero data rows
    - compare parsed header to exact ordered 15 fields without trim rename reorder projection or coercion
    - delete temporary bytes in finally and assert path absence
  fresh_form_structure_change: CONTRACT_SOURCE_MISMATCH
  post_retry: FORBIDDEN
bounded_artifact_policy:
  target_period: "2024-01"
  max_artifact_count: 1
  max_compressed_bytes: 268435456
  max_archive_members: 1
  max_declared_uncompressed_member_bytes: 2147483648
  max_header_read_bytes: 1048576
  data_rows_read: 0
  expected_member_type: SINGLE_REGULAR_UNENCRYPTED_CSV
  expected_content_types:
    - application/zip
    - application/x-zip-compressed
    - application/octet-stream
  storage: RUNNER_TEMPORARY_DIRECTORY_ONLY
  persistent_raw_or_csv_bytes: FORBIDDEN
  cleanup: REQUIRED_ON_SUCCESS_FAILURE_AND_INTERRUPTION
  cleanup_evidence: TEMPORARY_PATH_ABSENT_AND_ONLY_HASHED_PATH_FINGERPRINT_LOGGED
sanitized_output_policy:
  format: SINGLE_LINE_CANONICAL_JSON
  encoding: UTF-8
  canonicalization: SORTED_KEYS_COMPACT_SEPARATORS
  allowed:
    - closed result status and reason code
    - URLs statuses safe response headers byte counts and SHA-256
    - redirect metadata on allowlisted hosts
    - form method action control names types ids option names and non-secret values
    - hidden field names and one-way value hashes
    - request fingerprint without ephemeral values
    - archive member metadata and exact parsed header names
    - request counters durations runtime version and cleanup booleans
  forbidden:
    - HTML body or page excerpt
    - cookie value or full cookie header
    - hidden viewstate eventvalidation CSRF or token raw value
    - ZIP CSV or data row bytes
    - runner absolute temporary path
    - GitHub token environment or context dump
closed_results:
  SOURCE_COMPATIBLE:
    requires:
      - discovery and extract success contracts both pass
      - exact header equality is true
      - rights status supports local analysis with attribution
      - raw redistribution remains disabled
      - cleanup and all request limits pass
    next_gate: PH2_T02_R1_RESULT_READY_FOR_HUMAN_APPROVAL
  CONTRACT_SOURCE_MISMATCH:
    examples:
      - form or exact mapping is ambiguous
      - structure changes between discovery and extract
      - selected output header is not exact ordered 15
      - manual browser CAPTCHA login or reusable user state is required
  RIGHTS_UNRESOLVED:
    examples:
      - official source does not establish local analysis terms
      - only general CC-BY encouragement is found
  UPSTREAM_UNAVAILABLE:
    examples:
      - bounded official GET attempts cannot obtain the form or source pages
  PROBE_SECURITY_ABORTED:
    examples:
      - runner workflow uses an action checkout secret artifact cache or dependency
      - redirect host scheme request byte member time or concurrency limit fails
      - sanitized output leaks a forbidden value
      - unexpected script or platform failure prevents protocol evidence
result_and_cleanup_sequence:
  - emit one closed result from the approved set
  - fetch exact probe run logs and verify sanitized JSON offline
  - remove temporary workflow in the next repository commit
  - assert temporary workflow path absent on final main
  - create PHASE_2_SOURCE_COMPATIBILITY_REPORT_R1.md only after a real closed result
  - update PH2-T02-R1 task phase and project status without creating PH2-T03
  - run hosted Foundation on result commit
  - record result commit run evidence and verify final closeout commit Foundation success
success_phase_result:
  phase_2_status: ACTIVE
  phase_2_gate: PH2_T02_R1_RESULT_READY_FOR_HUMAN_APPROVAL
  active_task: null
  next_task_rule: PH2_T03_MAY_ONLY_BE_PLANNED_AFTER_SEPARATE_RESULT_APPROVAL
failure_phase_result:
