in_scope:
  - PH1-T02 checkpoint ve current repository manifest/hashes preflight'i
  - repository transient state'inden ayrılmış OS temporary clean-room snapshot'ı
  - standard GIL-enabled CPython 3.14.7 ve uv 0.12.3 exact bootstrap doğrulaması
  - iki ardışık frozen exact all-groups sync ve normalized environment idempotency karşılaştırması
  - import tool-version format lint strict-type ve pytest gate'lerinin ayrı yürütülmesi
  - repository dışındaki temporary path'te isolated wheel ve sdist build smoke
  - wheel metadata ve isolated installed-wheel import doğrulaması
  - uv audit ile project lock vulnerability deprecation ve quarantine kontrolü
  - CycloneDX 1.5 project SBOM üretimi ve SHA-256 kaydı
  - observed isolated build graph'ın temporary script lock ile ayrı audit edilmesi
  - runtime package manager project graph build graph ve CI action'ları için full license inventory
  - minimal SHA-pinned GitHub Actions foundation workflow'u
  - local clean-room ve gerçek GitHub-hosted CI parity kanıtı
  - compatibility matrix dependency catalog README task phase ve project durum güncellemeleri
  - clean-room dependency-audit ve Phase 1 exit raporları
  - transient artifact içermeyen doğrulanmış PH1-T03 checkpoint'i

out_of_scope:
  - src veya tests altında herhangi bir davranış assertion ya da dosya değişikliği
  - pyproject.toml uv.lock .python-version veya .gitignore değişikliği
  - yeni runtime development build audit license CI veya helper dependency eklemek
  - pre-commit coverage badge Makefile task runner Docker container deployment veya release workflow
  - artifact upload package publish deployment signing provenance attestation veya secret kullanımı
  - Windows macOS ARM GPU matrix veya cross-platform destek iddiası
  - GitHub branch-protection repository settings Dependabot ya da organization policy mutation'ı
  - BTS data cargo domain ML OR solver validator API database UI RAG LLM veya Hugging Face işi
  - Phase 2 ile Phase 8 için dependency path interface adapter TODO empty directory veya placeholder
  - Phase 1'i kapatmak veya Phase 2'yi açmak
  - security veya license bulgusunu ignore allowlist suppression override ya da sürüm değişikliğiyle çözmek

