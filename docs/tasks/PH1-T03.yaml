ci_candidate:
  decision_status: APPROVED
  approved_at: "2026-08-13"
  approval_source: explicit_user_command
  approval_text: "PH1-T03 CI stack adayını onaylıyorum."
  provider: GitHub Actions
  workflow_path: .github/workflows/foundation.yml
  workflow_name: Foundation
  runner: ubuntu-24.04
  architecture_claim: x86_64
  triggers:
    pull_request_to: [main]
    push_to: [main]
  forbidden_triggers:
    - pull_request_target
    - workflow_run
    - schedule
    - release
    - deployment
  permissions:
    contents: read
    all_unspecified: none
  secrets: NONE
  cache: DISABLED
  artifact_upload: DISABLED
  timeout_minutes: 15
  actions:
    - repository: actions/checkout
      release: v7.0.1
      full_commit_sha: 3d3c42e5aac5ba805825da76410c181273ba90b1
      license_spdx: MIT
    - repository: astral-sh/setup-uv
      release: v10.0.0
      full_commit_sha: ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d
      license_spdx: MIT
      inputs:
        version: 0.12.3
        python-version: 3.14.7
        enable-cache: false
  explicitly_rejected_actions:
    - actions/setup-python
    - actions/cache
    - actions/upload-artifact
  rejection_reason: >-
    setup-uv exact uv ve exact Python kurulumunu karşılar; cache clean-room
    kanıtını zayıflatır; permanent artifact upload Phase 1 için gerekli değildir.

license_policy:
  inventory_scope:
    - CPython runtime
    - uv bootstrap executable
    - project direct and transitive locked packages for all markers
    - isolated build backend and observed transitive packages
    - GitHub Actions used by the workflow
  acceptable_spdx_expressions:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - PSF-2.0
    - MPL-2.0
    - MIT OR Apache-2.0
    - Apache-2.0 OR BSD-2-Clause
  mandatory_review:
    - license expression from installed distribution metadata
    - canonical project metadata or LICENSE file cross-check
    - notice or source-disclosure obligation summary
    - package version source and marker applicability
  blockers:
    - UNKNOWN or missing license after canonical-source cross-check
    - proprietary noncommercial research-only SSPL BSL GPL or AGPL term
    - unresolved license conflict or redistribution restriction
    - source identity or exact version cannot be proven

security_policy:
  uv_malware_check: REQUIRED
  project_audit_command: uv audit --frozen --output-format json
  project_audit_scope: ALL_EXTRAS_AND_ALL_GROUPS_BY_DEFAULT
  build_graph_audit: REQUIRED_SEPARATE_TEMPORARY_SCRIPT_LOCK
  vulnerability_ignore_allowed: false
  ignore_until_fixed_allowed: false
  alternate_index_allowed: false
  insecure_host_allowed: false
  source_build_for_third_party_allowed: false
  blocker_statuses:
    - known_vulnerability
    - deprecated
    - quarantined
    - malware_or_adverse_status
    - yanked_or_unverifiable_distribution

execution_sequence:
  - step: 1
    name: approval_and_repository_preflight
    actions:
      - verify CI stack approval and PH1-T03 execution approval are separate and both present
      - verify active phase/task and all locked-phase invariants
      - verify PH1-T02 checkpoint integrity current manifest and frozen file hashes
      - verify no user change conflicts with files_allowed
      - record whether a GitHub remote/default main branch and authorized hosted run are available
    gate: ALL_PASS_OR_STOP
  - step: 2
    name: isolated_clean_room_snapshot
    actions:
      - create an OS temporary directory outside repository
      - materialize only current repository files while excluding transient and VCS metadata
      - record sorted relative-path manifest and SHA-256 values
      - assert no secret user-specific absolute path or Phase 2+ implementation artifact exists
      - use a task-specific uv cache under the temporary parent and no prior project .venv
    gate: CLEAN_SNAPSHOT_CREATED_OR_STOP
  - step: 3
    name: exact_bootstrap_and_two_syncs
    actions:
      - verify uv executable equals 0.12.3 and record provenance
      - install/find uv-managed standard GIL-enabled CPython exactly 3.14.7
      - verify pyproject and lock starting hashes
      - run first frozen exact all-groups sync with malware check enabled
      - record normalized installed distribution inventory
      - run second identical frozen exact all-groups sync
      - record and compare normalized inventory plus metadata/lock hashes
      - require uv sync --check and zero package add remove or update on second sync
    gate: IDEMPOTENT_AND_HASH_STABLE_OR_STOP
  - step: 4
    name: quality_and_build_gates
    actions:
      - run package import and exact version smoke
      - run Ruff format check and lint independently
      - run mypy strict over src and tests
      - run pytest with third-party plugin autoload disabled
      - build wheel and sdist outside repository with uv build --no-sources
      - inspect artifact name version Requires-Python and top-level package
      - install wheel into a second isolated temporary environment and import it
      - prove pyproject and lock hashes remain unchanged before and after build
    gate: ALL_COMMANDS_EXIT_ZERO_WITHOUT_RULE_WEAKENING
  - step: 5
    name: dependency_security_license_and_sbom
    actions:
      - run project uv audit frozen JSON with no ignore
      - export all-groups project CycloneDX 1.5 SBOM outside repository
      - capture observed isolated Hatchling build graph from verbose build evidence
      - reproduce that graph in a temporary PEP 723 script lock using Hatchling 1.32.0 and the frozen cutoff
      - require temporary build graph and observed build graph to match
      - audit and export CycloneDX for the temporary build graph
      - build the complete runtime tool project build and CI-action license inventory
      - cross-check every SPDX expression and obligation against canonical source
      - record hashes and summaries; remove raw temporary artifacts at closeout
    gate: ZERO_SECURITY_ADVERSE_OR_LICENSE_BLOCKER
  - step: 6
    name: minimal_ci_workflow
    actions:
      - re-verify exact CI candidate still matches approved release and SHA provenance
      - create only .github/workflows/foundation.yml
      - set top-level contents read permission and no secrets
      - use only full-SHA checkout and setup-uv actions
      - disable cache and artifact upload
      - mirror exact runtime sync quality build audit and SBOM commands
      - reject pull_request_target expressions from untrusted input and write permissions
      - statically review workflow against approved candidate before external run
    gate: EXACT_APPROVED_CI_FILE_ONLY
  - step: 7
    name: real_hosted_ci_evidence
    actions:
      - run the committed workflow on GitHub-hosted ubuntu-24.04 from the approved repository
      - verify checkout setup runtime both syncs quality build audit and SBOM steps pass
      - record repository commit SHA workflow run URL run ID attempt runner image and conclusion
      - confirm the run used the full-SHA actions and no secret or write permission
    gate: REAL_REMOTE_SUCCESS_REQUIRED_NOT_SIMULATED
  - step: 8
    name: reports_and_phase_1_exit_readiness
    actions:
      - create clean-room dependency-audit and Phase 1 exit reports
      - update compatibility matrix dependency catalog README task phase and project status
      - re-run local documentation YAML scope transient and conflict-marker checks
      - create and integrity-test a checkpoint excluding all transient artifacts
      - keep Phase 1 ACTIVE and Phase 2 through Phase 8 LOCKED
    gate: READY_FOR_SEPARATE_PHASE_1_CLOSE_AND_PHASE_2_OPEN_APPROVAL

acceptance_criteria:
  - both CI stack and execution approvals are explicitly recorded before implementation
  - only files in files_allowed are created or modified during execution
  - pyproject.toml uv.lock source tests and dependency declarations are byte-identical to pre-task hashes
  - uv is exactly 0.12.3 and Python is standard GIL-enabled CPython exactly 3.14.7
  - clean-room starts without a project .venv or repository cache
  - first and second sync are frozen exact all-groups and use canonical PyPI only
  - second sync adds removes or updates zero packages
  - normalized installed inventory and pyproject/lock hashes are identical across both syncs
  - package import and version smoke pass
  - Ruff format Ruff lint mypy strict and pytest pass as independent gates
  - no skip xfail ignore suppression fix or quality-rule weakening is introduced
  - wheel and sdist build outside repository and isolated wheel import pass
  - no third-party source build or native compiler invocation occurs
  - project and observed build graphs have zero vulnerability deprecation quarantine or adverse finding
  - no audit ignore allowlist insecure host or alternate index is used
  - CycloneDX 1.5 SBOMs are produced outside repository and their hashes are recorded
  - every runtime tool project build and CI-action component has verified exact identity and license
  - license policy has no unknown prohibited or unresolved entry
  - CI workflow exactly matches the separately approved candidate
  - all GitHub Actions references use full 40-character commit SHAs
  - CI has only contents read permission no secrets no cache no artifact upload and no write operation
  - an actual GitHub-hosted ubuntu-24.04 workflow run succeeds for the final committed state
  - Windows macOS ARM and GPU remain explicitly unverified
  - no Phase 2+ file dependency abstraction placeholder or behavior exists
  - Phase 1 remains ACTIVE and Phase 2 through Phase 8 remain LOCKED after task completion
  - checkpoint integrity and SHA-256 are recorded

tests_required:
  - safe-parse every repository YAML file
  - parse pyproject.toml with standard-library tomllib
  - compare pre-task and post-task sorted file manifests against files_allowed
  - compare pre-task and post-task SHA-256 for pyproject.toml uv.lock src and tests
  - verify exact runtime tool and action versions/SHAs
  - verify full-SHA regex for every workflow uses reference
  - verify workflow permission trigger cache secret and forbidden-event policy
  - run uv lock --check without mutation
  - run two frozen exact all-groups syncs and compare normalized inventories
  - run uv sync --check after each sync
  - run import and exact package-version smoke
  - run ruff format --check separately
  - run ruff check separately without fix
  - run mypy src tests under strict committed configuration
  - run pytest with PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
  - build outside repository with uv build --no-sources
  - inspect wheel and sdist metadata and hashes
  - install wheel into isolated environment and import package
  - run uv audit --frozen --output-format json with no ignores
  - run uv export --frozen --all-groups --format cyclonedx1.5 outside repository
  - audit the observed isolated build graph separately
  - validate complete license inventory and obligation fields
  - verify actual remote CI conclusion equals success for final commit SHA
  - verify no conflict marker unbalanced Markdown fence transient file or broken relative link
  - integrity-test final checkpoint archive and recompute its SHA-256

