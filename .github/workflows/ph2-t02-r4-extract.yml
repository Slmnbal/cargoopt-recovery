name: PH2-T02-R4 Bounded Extract

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ph2-t02-r4-extract.yml

permissions: {}

concurrency:
  group: ph2-t02-r4-bounded-extract
  cancel-in-progress: false

jobs:
  bounded-extract:
    name: Fresh-form January 2024 exact-15 header-only Extract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Run bounded standard-library Extract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import html
          import http.client
          import io
          import json
          import os
          import platform
          import re
          import ssl
          import tempfile
          import time
          import zipfile
          from html.parser import HTMLParser
          from pathlib import PurePosixPath
          from typing import Any, BinaryIO
          from urllib.parse import urlencode, urljoin, urlsplit


          PREFIX = "PH2_T02_R4_RESULT_JSON="
          FORM_URL = (
              "https://www.transtats.bts.gov/"
              "DL_SelectFields.aspx?QO_fu146_anzr=b0-gvzr&gnoyr_VQ=FGJ"
          )
          EXPECTED_FORM_SHA256 = (
              "3d9227bf05af8dcf8f4fef99aef86ebbbcbe43561869ba43444079d913b3f8b0"
          )
          EXPECTED_FIELDS = [
              "FlightDate",
              "Reporting_Airline",
              "DOT_ID_Reporting_Airline",
              "Flight_Number_Reporting_Airline",
              "OriginAirportID",
              "Origin",
              "DestAirportID",
              "Dest",
              "CRSDepTime",
              "CRSArrTime",
              "CRSElapsedTime",
              "Distance",
              "Cancelled",
              "Diverted",
              "ArrDelayMinutes",
          ]
          ALLOWED_HOSTS = {"www.transtats.bts.gov", "transtats.bts.gov"}
          ACCEPTED_ZIP_TYPES = {
              "application/zip",
              "application/x-zip-compressed",
              "application/octet-stream",
          }
          MAX_REQUESTS = 5
          MAX_REDIRECTS = 3
          MAX_FORM_BYTES = 8 * 1024 * 1024
          MAX_POST_BYTES = 8 * 1024 * 1024
          MAX_ZIP_BYTES = 256 * 1024 * 1024
          MAX_MEMBER_BYTES = 2 * 1024 * 1024 * 1024
          MAX_HEADER_BYTES = 1024 * 1024
          CONNECT_TIMEOUT = 10
          READ_TIMEOUT = 60
          MIN_INTERVAL = 1.0


          class ClosedError(Exception):
              def __init__(self, result: str, reason_code: str) -> None:
                  super().__init__(reason_code)
                  self.result = result
                  self.reason_code = reason_code


          def contract(reason_code: str) -> None:
              raise ClosedError("CONTRACT_SOURCE_MISMATCH", reason_code)


          def upstream(reason_code: str) -> None:
              raise ClosedError("UPSTREAM_UNAVAILABLE", reason_code)


          def security(reason_code: str) -> None:
              raise ClosedError("PROBE_SECURITY_ABORTED", reason_code)


          def canonical(value: Any) -> bytes:
              return json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")


          def sha256(value: bytes) -> str:
              return hashlib.sha256(value).hexdigest()


          def normalize(value: str) -> str:
              return re.sub(r"[^a-z0-9]", "", value.lower())


          def check_url(url: str) -> tuple[str, str]:
              parsed = urlsplit(url)
              host = (parsed.hostname or "").lower()
              if parsed.scheme != "https" or host not in ALLOWED_HOSTS:
                  security("URL_POLICY_VIOLATION")
              if parsed.username or parsed.password or parsed.fragment:
                  security("URL_CREDENTIAL_OR_FRAGMENT_FORBIDDEN")
              if parsed.port not in {None, 443}:
                  security("NON_STANDARD_HTTPS_PORT_FORBIDDEN")
              return host, parsed.path or "/"


          class Client:
              def __init__(self) -> None:
                  self.count = 0
                  self.post_count = 0
                  self.redirects = 0
                  self.last_at: float | None = None
                  self.context = ssl.create_default_context()
                  self.cookies: dict[str, dict[str, str]] = {}
                  self.temp_count = 0
                  self.temp_path: str | None = None

              def _pace(self) -> None:
                  now = time.monotonic()
                  if self.last_at is not None:
                      remaining = MIN_INTERVAL - (now - self.last_at)
                      if remaining > 0:
                          time.sleep(remaining)
                  self.last_at = time.monotonic()

              def _store_cookies(
                  self, host: str, headers: list[tuple[str, str]]
              ) -> None:
                  jar = self.cookies.setdefault(host, {})
                  for key, raw in headers:
                      if key.lower() != "set-cookie":
                          continue
                      pair = raw.split(";", 1)[0]
                      if "=" not in pair:
                          security("MALFORMED_SET_COOKIE")
                      name, value = pair.split("=", 1)
                      name = name.strip()
                      if not re.fullmatch(r"[!#$%&'*+.^_`|~0-9A-Za-z-]+", name):
                          security("UNSAFE_COOKIE_NAME")
                      if any(char in value for char in "\r\n"):
                          security("UNSAFE_COOKIE_VALUE")
                      jar[name] = value

              def _request(
                  self,
                  method: str,
                  url: str,
                  *,
                  body: bytes | None = None,
                  accept: str,
              ) -> tuple[http.client.HTTPSConnection, http.client.HTTPResponse]:
                  if method not in {"GET", "POST"}:
                      security("METHOD_POLICY_VIOLATION")
                  if self.count >= MAX_REQUESTS:
                      security("REQUEST_BUDGET_EXCEEDED")
                  if method == "POST" and self.post_count >= 1:
                      security("POST_BUDGET_EXCEEDED")
                  host, _ = check_url(url)
                  parsed = urlsplit(url)
                  target = parsed.path or "/"
                  if parsed.query:
                      target += "?" + parsed.query
                  self._pace()
                  self.count += 1
                  if method == "POST":
                      self.post_count += 1
                  headers = {
                      "Accept": accept,
                      "Accept-Encoding": "identity",
                      "User-Agent": "CargoOptRecovery-PH2-T02-R4/1.0",
                  }
                  cookie_jar = self.cookies.get(host, {})
                  if cookie_jar:
                      headers["Cookie"] = "; ".join(
                          f"{name}={cookie_jar[name]}" for name in sorted(cookie_jar)
                      )
                  if method == "POST":
                      if body is None or len(body) > MAX_POST_BYTES:
                          security("POST_BODY_SIZE_POLICY_VIOLATION")
                      headers["Content-Type"] = "application/x-www-form-urlencoded"
                      headers["Content-Length"] = str(len(body))
                  connection = http.client.HTTPSConnection(
                      host,
                      parsed.port or 443,
                      timeout=CONNECT_TIMEOUT,
                      context=self.context,
                  )
                  try:
                      connection.request(method, target, body=body, headers=headers)
                      response = connection.getresponse()
                      if connection.sock is not None:
                          connection.sock.settimeout(READ_TIMEOUT)
                      self._store_cookies(host, response.getheaders())
                      return connection, response
                  except Exception:
                      connection.close()
                      raise

              def get_form(self, requested_url: str) -> tuple[dict[str, Any], bytes]:
                  current = requested_url
                  started = time.monotonic()
                  while True:
                      connection, response = self._request(
                          "GET",
                          current,
                          accept="text/html,application/xhtml+xml",
                      )
                      try:
                          status = response.status
                          location = response.getheader("Location")
                          if status in {301, 302, 303, 307, 308}:
                              if not location:
                                  upstream("FORM_REDIRECT_WITHOUT_LOCATION")
                              self.redirects += 1
                              if self.redirects > MAX_REDIRECTS:
                                  security("REDIRECT_BUDGET_EXCEEDED")
                              current = urljoin(current, location)
                              check_url(current)
                              continue
                          if status != 200:
                              upstream("FORM_GET_NOT_200")
                          body = bytearray()
                          while True:
                              chunk = response.read(65536)
                              if not chunk:
                                  break
                              body.extend(chunk)
                              if len(body) > MAX_FORM_BYTES:
                                  security("FORM_RESPONSE_BYTE_LIMIT_EXCEEDED")
                          raw = bytes(body)
                          return (
                              {
                                  "status": status,
                                  "final_url": current,
                                  "content_type": response.getheader("Content-Type"),
                                  "byte_count": len(raw),
                                  "sha256": sha256(raw),
                                  "elapsed_ms": round(
                                      (time.monotonic() - started) * 1000
                                  ),
                              },
                              raw,
                          )
                      finally:
                          connection.close()

              def post_archive(self, action: str, body: bytes) -> dict[str, Any]:
                  current = action
                  method = "POST"
                  current_body: bytes | None = body
                  started = time.monotonic()
                  while True:
                      connection, response = self._request(
                          method,
                          current,
                          body=current_body,
                          accept=(
                              "application/zip,application/x-zip-compressed,"
                              "application/octet-stream"
                          ),
                      )
                      try:
                          status = response.status
                          location = response.getheader("Location")
                          if status in {301, 302, 303, 307, 308}:
                              if not location:
                                  upstream("EXTRACT_REDIRECT_WITHOUT_LOCATION")
                              if method == "POST" and status in {307, 308}:
                                  security("POST_REPLAY_REDIRECT_FORBIDDEN")
                              self.redirects += 1
                              if self.redirects > MAX_REDIRECTS:
                                  security("REDIRECT_BUDGET_EXCEEDED")
                              current = urljoin(current, location)
                              check_url(current)
                              method = "GET"
                              current_body = None
                              continue
                          if status != 200:
                              upstream("EXTRACT_RESPONSE_NOT_200")
                          content_type = (
                              response.getheader("Content-Type") or ""
                          ).split(";", 1)[0].strip().lower()
                          if content_type not in ACCEPTED_ZIP_TYPES:
                              upstream("EXTRACT_RESPONSE_NOT_ZIP_TYPE")
                          content_length_raw = response.getheader("Content-Length")
                          if content_length_raw:
                              try:
                                  declared_length = int(content_length_raw)
                              except ValueError:
                                  security("INVALID_CONTENT_LENGTH")
                              if declared_length < 0 or declared_length > MAX_ZIP_BYTES:
                                  security("ZIP_DECLARED_SIZE_LIMIT_EXCEEDED")
                          if self.temp_count >= 1 or self.temp_path is not None:
                              security("TEMPORARY_ZIP_COUNT_EXCEEDED")
                          temporary = tempfile.NamedTemporaryFile(
                              mode="wb",
                              prefix="cargoopt-r4-",
                              suffix=".zip",
                              dir=tempfile.gettempdir(),
                              delete=False,
                          )
                          self.temp_count += 1
                          self.temp_path = os.path.abspath(temporary.name)
                          digest = hashlib.sha256()
                          byte_count = 0
                          with temporary:
                              while True:
                                  chunk = response.read(65536)
                                  if not chunk:
                                      break
                                  byte_count += len(chunk)
                                  if byte_count > MAX_ZIP_BYTES:
                                      security("ZIP_STREAM_SIZE_LIMIT_EXCEEDED")
                                  digest.update(chunk)
                                  temporary.write(chunk)
                          if byte_count == 0:
                              upstream("EMPTY_ZIP_RESPONSE")
                          return {
                              "status": status,
                              "final_url": current,
                              "content_type": content_type,
                              "byte_count": byte_count,
                              "sha256": digest.hexdigest(),
                              "elapsed_ms": round(
                                  (time.monotonic() - started) * 1000
                              ),
                          }
                      finally:
                          connection.close()

              def cleanup(self) -> bool:
                  if self.temp_path is None:
                      return True
                  try:
                      if os.path.lexists(self.temp_path):
                          os.unlink(self.temp_path)
                  except OSError:
                      return False
                  return not os.path.lexists(self.temp_path)


          class FormParser(HTMLParser):
              def __init__(self) -> None:
                  super().__init__(convert_charrefs=True)
                  self.forms: list[dict[str, Any]] = []
                  self.form_stack: list[int] = []
                  self.controls: list[dict[str, Any]] = []
                  self.input_payload: list[dict[str, Any]] = []
                  self.select_payload: list[dict[str, Any]] = []
                  self.button_payload: list[dict[str, Any]] = []
                  self.unsupported_success_controls: list[dict[str, Any]] = []
                  self.current_select: dict[str, Any] | None = None
                  self.current_select_payload: dict[str, Any] | None = None
                  self.current_option: dict[str, Any] | None = None
                  self.current_option_payload: dict[str, Any] | None = None
                  self.current_button: dict[str, Any] | None = None
                  self.last_visible_control: dict[str, Any] | None = None
                  self.text_parts: list[str] = []

              @staticmethod
              def attrs(attrs: list[tuple[str, str | None]]) -> dict[str, str]:
                  return {key.lower(): value or "" for key, value in attrs}

              @property
              def form_index(self) -> int | None:
                  return self.form_stack[-1] if self.form_stack else None

              def handle_starttag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  tag = tag.lower()
                  values = self.attrs(attrs)
                  if tag == "form":
                      index = len(self.forms)
                      self.forms.append(
                          {
                              "index": index,
                              "action": values.get("action", ""),
                              "method": values.get("method", "get").upper(),
                              "id": values.get("id", ""),
                              "name": values.get("name", ""),
                          }
                      )
                      self.form_stack.append(index)
                      self.last_visible_control = None
                  elif tag == "input":
                      control_type = values.get("type", "text").lower()
                      control: dict[str, Any] = {
                          "tag": "input",
                          "type": control_type,
                          "name": values.get("name", ""),
                          "id": values.get("id", ""),
                          "form_index": self.form_index,
                          "checked": "checked" in values,
                          "disabled": "disabled" in values,
                          "following_text": "",
                      }
                      raw_value = values.get("value", "")
                      if control_type == "hidden":
                          control["value_present"] = bool(raw_value)
                      elif control_type in {"checkbox", "radio", "submit", "button"}:
                          control["value"] = raw_value[:256]
                      control_index = len(self.controls)
                      self.controls.append(control)
                      self.input_payload.append(
                          {
                              "control_index": control_index,
                              "form_index": self.form_index,
                              "type": control_type,
                              "name": values.get("name", ""),
                              "disabled": "disabled" in values,
                              "checked": "checked" in values,
                              "raw_value": raw_value,
                          }
                      )
                      self.last_visible_control = (
                          control if control_type in {"checkbox", "radio"} else None
                      )
                  elif tag == "select":
                      self.current_select = {
                          "tag": "select",
                          "type": "select",
                          "name": values.get("name", ""),
                          "id": values.get("id", ""),
                          "form_index": self.form_index,
                          "disabled": "disabled" in values,
                          "options": [],
                      }
                      control_index = len(self.controls)
                      self.controls.append(self.current_select)
                      self.current_select_payload = {
                          "control_index": control_index,
                          "form_index": self.form_index,
                          "name": values.get("name", ""),
                          "disabled": "disabled" in values,
                          "multiple": "multiple" in values,
                          "options": [],
                      }
                      self.select_payload.append(self.current_select_payload)
                      self.last_visible_control = None
                  elif tag == "option" and self.current_select is not None:
                      self.current_option = {
                          "value": values.get("value", "")[:256],
                          "label": "",
                          "selected": "selected" in values,
                          "disabled": "disabled" in values,
                      }
                      self.current_select["options"].append(self.current_option)
                      self.current_option_payload = {
                          "raw_value": values.get("value", ""),
                          "label": "",
                          "selected": "selected" in values,
                          "disabled": "disabled" in values,
                      }
                      if self.current_select_payload is None:
                          security("SELECT_PAYLOAD_STATE_INVALID")
                      self.current_select_payload["options"].append(
                          self.current_option_payload
                      )
                  elif tag == "button":
                      self.current_button = {
                          "tag": "button",
                          "type": values.get("type", "submit").lower(),
                          "name": values.get("name", ""),
                          "id": values.get("id", ""),
                          "raw_value": values.get("value", ""),
                          "form_index": self.form_index,
                          "disabled": "disabled" in values,
                          "text": "",
                      }
                      self.button_payload.append(self.current_button)
                  elif tag == "textarea" and self.form_index is not None:
                      if values.get("name") and "disabled" not in values:
                          self.unsupported_success_controls.append(
                              {"tag": "textarea", "form_index": self.form_index}
                          )

              def handle_startendtag(
                  self, tag: str, attrs: list[tuple[str, str | None]]
              ) -> None:
                  self.handle_starttag(tag, attrs)

              def handle_endtag(self, tag: str) -> None:
                  tag = tag.lower()
                  if tag == "form" and self.form_stack:
                      self.form_stack.pop()
                      self.last_visible_control = None
                  elif tag == "select":
                      self.current_select = None
                      self.current_select_payload = None
                  elif tag == "option":
                      self.current_option = None
                      self.current_option_payload = None
                  elif tag == "button":
                      self.current_button = None

              def handle_data(self, data: str) -> None:
                  compact = " ".join(data.split())
                  if not compact:
                      return
                  self.text_parts.append(compact)
                  if self.current_option is not None:
                      self.current_option["label"] = (
                          self.current_option["label"] + " " + compact
                      ).strip()[:256]
                      if self.current_option_payload is not None:
                          self.current_option_payload["label"] = (
                              self.current_option_payload["label"] + " " + compact
                          ).strip()
                  elif self.last_visible_control is not None:
                      self.last_visible_control["following_text"] = (
                          self.last_visible_control["following_text"] + " " + compact
                      ).strip()[:512]
                  if self.current_button is not None:
                      self.current_button["text"] = (
                          self.current_button["text"] + " " + compact
                      ).strip()[:512]


          def decode(raw: bytes, content_type: str | None) -> str:
              match = re.search(r"charset=([A-Za-z0-9._-]+)", content_type or "", re.I)
              charset = match.group(1) if match else "utf-8"
              try:
                  return raw.decode(charset, errors="replace")
              except LookupError:
                  return raw.decode("utf-8", errors="replace")


          def safe_control(control: dict[str, Any]) -> dict[str, Any]:
              output = {
                  key: control[key]
                  for key in (
                      "tag",
                      "type",
                      "name",
                      "id",
                      "form_index",
                      "checked",
                      "disabled",
                      "value_present",
                  )
                  if key in control
              }
              if "value" in control:
                  output["value"] = control["value"]
              if "following_text" in control:
                  output["following_token"] = control["following_text"].split(" ", 1)[0]
              if "options" in control:
                  output["options"] = control["options"]
              return output


          def control_candidates(control: dict[str, Any]) -> set[str]:
              values = {
                  str(control.get("name", "")),
                  str(control.get("id", "")),
                  str(control.get("value", "")),
              }
              following = str(control.get("following_text", ""))
              if following:
                  values.add(following.split(" ", 1)[0])
              for option in control.get("options", []):
                  values.add(str(option.get("value", "")))
                  values.add(str(option.get("label", "")))
              return {normalize(value) for value in values if value}


          def option_matches(option: dict[str, Any], accepted: set[str]) -> bool:
              return bool(
                  {
                      normalize(str(option.get("value", ""))),
                      normalize(str(option.get("label", ""))),
                  }.intersection(accepted)
              )


          def one_option(
              parser: FormParser, accepted: set[str], selected_form_index: int
          ) -> tuple[dict[str, Any], dict[str, Any]]:
              matches: list[tuple[dict[str, Any], dict[str, Any]]] = []
              for select in parser.select_payload:
                  if select["form_index"] != selected_form_index:
                      continue
                  for option in select["options"]:
                      if option_matches(option, accepted):
                          matches.append((select, option))
              if len(matches) != 1:
                  contract("YEAR_OR_MONTH_SELECTOR_NOT_EXACT")
              return matches[0]


          def choose_submit(
              parser: FormParser, selected_form_index: int
          ) -> dict[str, Any]:
              candidates: list[dict[str, Any]] = []
              for item in parser.input_payload:
                  if (
                      item["form_index"] == selected_form_index
                      and not item["disabled"]
                      and item["type"] in {"submit", "button"}
                  ):
                      control = parser.controls[item["control_index"]]
                      tokens = [
                          item["name"],
                          item["raw_value"],
                          str(control.get("id", "")),
                          str(control.get("following_text", "")),
                      ]
                      if any("download" in normalize(token) for token in tokens):
                          candidates.append({"kind": "input", **item})
              for item in parser.button_payload:
                  if (
                      item["form_index"] == selected_form_index
                      and not item["disabled"]
                      and item["type"] == "submit"
                  ):
                      tokens = [
                          item["name"],
                          item["id"],
                          item["raw_value"],
                          item["text"],
                      ]
                      if any("download" in normalize(token) for token in tokens):
                          candidates.append({"kind": "button", **item})
              if len(candidates) != 1:
                  contract("DOWNLOAD_SUBMIT_CONTROL_NOT_EXACT")
              selected = candidates[0]
              if not selected.get("name"):
                  contract("DOWNLOAD_SUBMIT_CONTROL_UNNAMED")
              return selected


          def build_payload(
              parser: FormParser,
              selected_form_index: int,
              field_control_indices: list[int],
              year: tuple[dict[str, Any], dict[str, Any]],
              month: tuple[dict[str, Any], dict[str, Any]],
              submit: dict[str, Any],
          ) -> tuple[bytes, str]:
              pairs: list[tuple[str, str]] = []
              field_set = set(field_control_indices)
              for item in parser.input_payload:
                  if item["form_index"] != selected_form_index or item["disabled"]:
                      continue
                  name = item["name"]
                  input_type = item["type"]
                  if input_type in {"checkbox", "radio", "submit", "button", "reset"}:
                      continue
                  if input_type in {"file", "image"}:
                      contract("UNSUPPORTED_SUCCESSFUL_INPUT_TYPE")
                  if name:
                      pairs.append((name, item["raw_value"]))

              selected_controls = {year[0]["control_index"], month[0]["control_index"]}
              for select in parser.select_payload:
                  if (
                      select["form_index"] != selected_form_index
                      or select["disabled"]
                      or not select["name"]
                  ):
                      continue
                  if select["control_index"] == year[0]["control_index"]:
                      options = [year[1]]
                  elif select["control_index"] == month[0]["control_index"]:
                      options = [month[1]]
                  else:
                      options = [
                          option
                          for option in select["options"]
                          if option["selected"] and not option["disabled"]
                      ]
                      if not options and not select["multiple"]:
                          options = [
                              option
                              for option in select["options"]
                              if not option["disabled"]
                          ][:1]
                  for option in options:
                      pairs.append((select["name"], option["raw_value"]))

              field_contract: list[dict[str, str]] = []
              for expected, control_index in zip(EXPECTED_FIELDS, field_control_indices):
                  item_matches = [
                      item
                      for item in parser.input_payload
                      if item["control_index"] == control_index
                  ]
                  if len(item_matches) != 1:
                      contract("FIELD_PAYLOAD_CONTROL_NOT_EXACT")
                  item = item_matches[0]
                  if (
                      item["type"] != "checkbox"
                      or item["disabled"]
                      or not item["name"]
                      or control_index not in field_set
                  ):
                      contract("FIELD_PAYLOAD_CONTROL_NOT_SUBMITTABLE")
                  pairs.append((item["name"], item["raw_value"] or "on"))
                  field_contract.append({"field": expected, "name": item["name"]})

              pairs.append((str(submit["name"]), str(submit.get("raw_value", ""))))
              encoded = urlencode(pairs, doseq=True).encode("ascii")
              if not encoded or len(encoded) > MAX_POST_BYTES:
                  security("ENCODED_POST_BODY_SIZE_POLICY_VIOLATION")
              submission_contract = {
                  "action": "HTTPS_ALLOWLISTED_POST",
                  "year": {"name": year[0]["name"], "value": year[1]["raw_value"]},
                  "month": {"name": month[0]["name"], "value": month[1]["raw_value"]},
                  "fields": field_contract,
                  "submit": {"kind": submit["kind"], "name": submit["name"]},
                  "selected_control_count": len(selected_controls),
              }
              return encoded, sha256(canonical(submission_contract))


          def read_header(member: BinaryIO) -> bytes:
              header = bytearray()
              while len(header) < MAX_HEADER_BYTES:
                  value = member.read(1)
                  if not value:
                      break
                  header.extend(value)
                  if value == b"\n":
                      break
              if not header:
                  contract("CSV_HEADER_EMPTY")
              if len(header) >= MAX_HEADER_BYTES and not header.endswith(b"\n"):
                  security("CSV_HEADER_BYTE_LIMIT_EXCEEDED")
              return bytes(header)


          def inspect_archive(path: str) -> dict[str, Any]:
              try:
                  archive = zipfile.ZipFile(path, mode="r")
              except (OSError, zipfile.BadZipFile):
                  contract("ZIP_CONTAINER_INVALID")
              with archive:
                  members = archive.infolist()
                  if len(members) != 1:
                      contract("ZIP_MEMBER_COUNT_NOT_EXACTLY_ONE")
                  info = members[0]
                  pure = PurePosixPath(info.filename.replace("\\", "/"))
                  if (
                      info.is_dir()
                      or pure.is_absolute()
                      or not pure.parts
                      or any(part in {"", ".", ".."} for part in pure.parts)
                      or len(pure.parts) != 1
                  ):
                      security("ZIP_MEMBER_PATH_UNSAFE")
                  if pure.suffix.lower() != ".csv":
                      contract("ZIP_MEMBER_NOT_CSV")
                  if info.flag_bits & 0x1:
                      security("ZIP_MEMBER_ENCRYPTED")
                  if info.file_size < 0 or info.file_size > MAX_MEMBER_BYTES:
                      security("ZIP_MEMBER_DECLARED_SIZE_LIMIT_EXCEEDED")
                  try:
                      with archive.open(info, mode="r") as member:
                          raw_header = read_header(member)
                  except (OSError, RuntimeError, zipfile.BadZipFile):
                      contract("ZIP_MEMBER_HEADER_READ_FAILED")
              try:
                  header_text = raw_header.decode("utf-8-sig", errors="strict")
              except UnicodeDecodeError:
                  contract("CSV_HEADER_NOT_UTF8")
              try:
                  rows = list(csv.reader(io.StringIO(header_text, newline="")))
              except csv.Error:
                  contract("CSV_HEADER_PARSE_FAILED")
              if len(rows) != 1:
                  contract("CSV_HEADER_RECORD_COUNT_NOT_ONE")
              if rows[0] != EXPECTED_FIELDS:
                  contract("CSV_HEADER_EXACT_ORDER_MISMATCH")
              return {
                  "member_count": 1,
                  "member_name_sha256": sha256(info.filename.encode("utf-8")),
                  "member_compressed_bytes": info.compress_size,
                  "member_declared_uncompressed_bytes": info.file_size,
                  "member_crc32_hex": f"{info.CRC:08x}",
                  "header_byte_count": len(raw_header),
                  "header_sha256": sha256(raw_header),
                  "header_record_count": 1,
                  "header_column_count": len(rows[0]),
                  "header_exact_ordered": True,
              }


          def self_test() -> None:
              if canonical({"b": 1, "a": 2}) != b'{"a":2,"b":1}':
                  security("SELF_TEST_CANONICAL_FAILED")
              parser = FormParser()
              parser.feed(
                  '<form action="/x" method="post">'
                  '<input type="hidden" name="token" value="private">'
                  '<input type="checkbox" name="fields" value="FlightDate">'
                  "FlightDate</form>"
              )
              material = canonical([safe_control(item) for item in parser.controls])
              if b"private" in material or b"value_present" not in material:
                  security("SELF_TEST_HIDDEN_REDACTION_FAILED")
              fixture = io.BytesIO()
              with zipfile.ZipFile(fixture, "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.writestr("fixture.csv", ",".join(EXPECTED_FIELDS) + "\n1,row\n")
              fixture.seek(0)
              with zipfile.ZipFile(fixture, "r") as archive:
                  with archive.open(archive.infolist()[0], "r") as member:
                      first = read_header(member)
              if first.decode("utf-8").rstrip("\r\n").split(",") != EXPECTED_FIELDS:
                  security("SELF_TEST_HEADER_BOUND_FAILED")
              try:
                  check_url("http://www.transtats.bts.gov/")
              except ClosedError as error:
                  if error.result != "PROBE_SECURITY_ABORTED":
                      security("SELF_TEST_URL_POLICY_FAILED")
              else:
                  security("SELF_TEST_URL_POLICY_FAILED")


          started = time.monotonic()
          client = Client()
          form_metadata: dict[str, Any] | None = None
          form_fingerprint: str | None = None
          submission_sha256: str | None = None
          archive_metadata: dict[str, Any] | None = None
          header_metadata: dict[str, Any] | None = None
          closed_result = "PROBE_SECURITY_ABORTED"
          reason_code = "UNEXPECTED_INTERNAL_EXCEPTION"
          try:
              self_test()
              form_metadata, form_body = client.get_form(FORM_URL)
              parser = FormParser()
              parser.feed(decode(form_body, form_metadata["content_type"]))

              field_resolution: dict[str, list[int]] = {}
              for field in EXPECTED_FIELDS:
                  wanted = normalize(field)
                  field_resolution[field] = [
                      index
                      for index, control in enumerate(parser.controls)
                      if wanted in control_candidates(control)
                  ]
              if not all(len(field_resolution[field]) == 1 for field in EXPECTED_FIELDS):
                  contract("EXACT_15_FIELD_MAPPING_FAILED")
              field_control_indices = [
                  field_resolution[field][0] for field in EXPECTED_FIELDS
              ]
              if len(set(field_control_indices)) != len(EXPECTED_FIELDS):
                  contract("EXACT_15_FIELD_MAPPING_NOT_ONE_TO_ONE")
              mapped_form_indices = {
                  parser.controls[index].get("form_index")
                  for index in field_control_indices
              }
              if len(mapped_form_indices) != 1 or None in mapped_form_indices:
                  contract("EXACT_15_FIELDS_NOT_IN_ONE_FORM")
              selected_form_index = next(iter(mapped_form_indices))
              selected_form = parser.forms[selected_form_index]

              raw_action = html.unescape(selected_form.get("action", ""))
              action = urljoin(form_metadata["final_url"], raw_action)
              check_url(action)
              if selected_form.get("method") != "POST":
                  contract("FORM_METHOD_NOT_POST")

              selected_controls = [
                  safe_control(control)
                  for control in parser.controls
                  if control.get("form_index") == selected_form_index
              ]
              form_contract = {
                  "action": action,
                  "action_policy_ok": True,
                  "action_reason": "HTTPS_ALLOWLISTED",
                  "method": selected_form.get("method"),
                  "form_id": selected_form.get("id"),
                  "form_name": selected_form.get("name"),
                  "controls": selected_controls,
              }
              form_fingerprint = sha256(canonical(form_contract))
              if form_fingerprint != EXPECTED_FORM_SHA256:
                  contract("FRESH_FORM_FINGERPRINT_MISMATCH")

              page_lower = " ".join(parser.text_parts).lower()
              interaction = {
                  "login": any(value in page_lower for value in ("sign in", "log in", "login")),
                  "captcha": "captcha" in page_lower,
                  "manual": any(
                      value in page_lower
                      for value in ("manual verification", "human verification")
                  ),
                  "password_control": any(
                      control.get("type") == "password" for control in parser.controls
                  ),
              }
              if any(interaction.values()):
                  security("INTERACTIVE_OR_AUTHENTICATED_FORM_FORBIDDEN")
              if any(
                  parser.controls[index].get("type") != "checkbox"
                  or parser.controls[index].get("disabled")
                  for index in field_control_indices
              ):
                  contract("EXACT_FIELDS_NOT_ENABLED_CHECKBOXES")
              for index, control in enumerate(parser.controls):
                  if (
                      control.get("form_index") == selected_form_index
                      and control.get("type") in {"checkbox", "radio"}
                      and control.get("checked")
                      and index not in set(field_control_indices)
                  ):
                      contract("CHECKED_CONTROL_OUTSIDE_EXACT_15")
              if any(
                  item["form_index"] == selected_form_index
                  for item in parser.unsupported_success_controls
              ):
                  contract("UNSUPPORTED_SUCCESSFUL_FORM_CONTROL")

              year = one_option(parser, {"2024"}, selected_form_index)
              month = one_option(parser, {"1", "01", "jan", "january"}, selected_form_index)
              submit = choose_submit(parser, selected_form_index)
              post_body, submission_sha256 = build_payload(
                  parser,
                  selected_form_index,
                  field_control_indices,
                  year,
                  month,
                  submit,
              )
              archive_metadata = client.post_archive(action, post_body)
              if client.temp_path is None:
                  security("TEMPORARY_ZIP_NOT_CREATED")
              header_metadata = inspect_archive(client.temp_path)
              closed_result = "SOURCE_COMPATIBLE"
              reason_code = "FRESH_FORM_AND_EXACT_HEADER_PASSED"
          except ClosedError as error:
              closed_result = error.result
              reason_code = error.reason_code
          except Exception:
              closed_result = "PROBE_SECURITY_ABORTED"
              reason_code = "UNEXPECTED_INTERNAL_EXCEPTION"
          finally:
              temporary_path_sha256 = (
                  sha256(client.temp_path.encode("utf-8"))
                  if client.temp_path is not None
                  else None
              )
              cleanup_path_absent = client.cleanup()
              if not cleanup_path_absent:
                  closed_result = "PROBE_SECURITY_ABORTED"
                  reason_code = "MANDATORY_CLEANUP_FAILED"

          result = {
              "schema_version": 1,
              "mode": "BOUNDED_HEADER_ONLY_EXTRACT",
              "result": closed_result,
              "reason_code": reason_code,
              "runtime": {
                  "implementation": platform.python_implementation(),
                  "python": platform.python_version(),
                  "os": platform.system(),
                  "architecture": platform.machine(),
              },
              "rights_precondition": {
                  "result": "RIGHTS_READY_FOR_EXTRACT_PLANNING",
                  "local_analysis_with_attribution": True,
                  "raw_redistribution_enabled": False,
              },
              "request_policy": {
                  "methods": ["GET", "POST"],
                  "count": client.count,
                  "max": MAX_REQUESTS,
                  "post_count": client.post_count,
                  "post_max": 1,
                  "redirect_count": client.redirects,
                  "redirect_max": MAX_REDIRECTS,
                  "minimum_interval_seconds": MIN_INTERVAL,
                  "connect_timeout_seconds": CONNECT_TIMEOUT,
                  "read_timeout_seconds": READ_TIMEOUT,
                  "automatic_retry_count": 0,
                  "elapsed_ms": round((time.monotonic() - started) * 1000),
              },
              "form": {
                  "fresh_get_completed": form_metadata is not None,
                  "response": form_metadata,
                  "contract_sha256": form_fingerprint,
                  "expected_contract_sha256": EXPECTED_FORM_SHA256,
                  "contract_exact": form_fingerprint == EXPECTED_FORM_SHA256,
                  "year": 2024,
                  "month": "January",
                  "selected_field_count": len(EXPECTED_FIELDS),
                  "submission_contract_sha256": submission_sha256,
              },
              "archive_response": archive_metadata,
              "zip": {
                  "temporary_zip_count": client.temp_count,
                  "temporary_zip_count_max": 1,
                  "temporary_path_sha256": temporary_path_sha256,
                  "cleanup_path_absent": cleanup_path_absent,
                  "persistent_archive": False,
                  "raw_redistribution_enabled": False,
              },
              "header": header_metadata,
              "header_records_read": 1 if header_metadata is not None else 0,
              "data_rows_read": 0,
              "artifact_count": 0,
              "cookie_values_logged": False,
              "hidden_values_logged": False,
              "post_body_logged": False,
              "response_body_logged": False,
              "automatic_rerun_count": 0,
          }
          print(PREFIX + canonical(result).decode("utf-8"))
