acceptance_criteria:
  - bir recovery case tam bir kaynak uçuş ve tam bir destinasyon içermeli
  - recovery penceresi prediction cutoff anından başlayan 24 saat olmalı
  - her gönderi tam bir uçuşa atanmalı veya UNASSIGNED kalmalı
  - split shipment yasak olmalı
  - PHARMA yalnızca cold-chain uyumlu uçuşa atanabilmeli
  - gönderi ve kapasite birimleri kg ve m3 olmalı
  - bütün zamanlar UTC ve timezone-aware olmalı
  - para birimi TRY ve cost basis SYNTHETIC_NOMINAL_2024 olmalı
  - maliyetlerin gerçek Turkish Cargo maliyeti olmadığı açık olmalı
  - unassigned penalty her sınıfın maksimum assignment maliyetinden büyük olmalı
  - ML-informed objective yalnızca immutable prediction batch olasılığını eklemeli
  - tahmin ufukları yalnızca 24 18 12 ve 6 saat olmalı
  - candidate prediction karar anından sonra üretilmiş olamamalı
  - candidate için karar anında kullanılabilir en yakın horizon seçilmeli
  - aynı uçuşun bütün horizon satırları aynı zaman partition'ında kalmalı
  - generator ML olasılığı veya gerçekleşmiş outcome okuyamamalı
  - aynı seed config ve case key aynı canonical çıktıyı üretmeli
  - PHASE_1 ile PHASE_8 kilitli kalmalı
  - kapsam dışı dosya dependency veya implementation oluşmamalı
tests_required:
  - bütün YAML dosyaları safe parser ile parse edilebilmeli
  - tam bir ACTIVE faz bulunmalı ve bu PHASE_0 olmalı
  - OR schema required alanları benzersiz ve tanımlı olmalı
  - cargo enum değerleri belgeler ve schema arasında eşleşmeli
  - shipment count minimum maximum ve default sınır içinde olmalı
  - candidate flight maksimumu 30 ve recovery window 24 olmalı
  - cargo sınıf oranları tam 1.0 olmalı
  - cost currency basis ve katsayıları belgeler ve schema arasında eşleşmeli
  - unassigned dominance eşitsizliği üç cargo sınıfı için geçmeli
  - forbidden outcome ve prediction alanları generator input listesinde bulunmamalı
  - risk-blind ve ML-informed formülleri tek kontrollü fark taşımalı
  - multi-horizon feature schema tam 27 benzersiz model input içermeli
  - lead_time_hours yalnızca 6 12 18 veya 24 olmalı
  - selected horizon ceiling kuralı sınır örneklerinde doğrulanmalı
  - produced_at UTC zamanı recovery decision zamanını aşmamalı
  - onaylı mevcut ve yeni dosyalar dışında dosya oluşmamalı
  - uygulama dependency database ve UI yolları bulunmamalı
  - conflict marker ve dengesiz Markdown code fence bulunmamalı
dependencies_allowed: false
migrations_allowed: false
stop_conditions:
  - onaylı dosya dışında değişiklik gereksinimi
  - para birimi veya katsayıların gerçek şirket verisi gibi sunulma riski
  - unassigned penalty dominance kuralının sağlanamaması
  - generator girdisine ML skoru veya outcome ekleme gereksinimi
  - recovery kararından sonra üretilmiş prediction kullanma gereksinimi
  - recovery penceresi veya eligibility anlamında çelişki
  - PH0-T01 PH0-T02 ya da kabul edilmiş ADR ile çelişki
  - uygulama kodu dependency veri indirme veya solver gereksinimi
  - mevcut kullanıcı dosyalarıyla çakışma
