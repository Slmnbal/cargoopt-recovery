phase: PHASE_1
status: COMPLETED
planned_at: "2026-08-13"
planning_source: explicit_user_request
execution_requires_separate_human_approval: true
execution_approval_status: APPROVED
execution_approved_at: "2026-08-13"
execution_approval_source: explicit_user_command
execution_approval_text: "PH1-T02 planını onaylıyorum; başlat"
started_at: "2026-08-13"
completed_at: "2026-08-13"
goal: >-
  Onaylanmış exact CPython ve foundation toolchain ile yalnız import edilebilir
  minimal Python package shell'ini, canonical PyPI kaynaklı deterministic
  uv.lock dosyasını ve local format lint strict-type test build kapılarını
  oluşturmak; hiçbir Phase 2+ ürün davranışı veya placeholder eklememek.

preconditions:
  phase_1_status: ACTIVE
  ph1_t01_status: COMPLETED
  toolchain_decision_status: APPROVED
  adr_009_status: ACCEPTED
  execution_approval: SATISFIED

approved_toolchain_snapshot:
  runtime:
    implementation: CPython
    version: 3.14.7
    variant: standard_gil_enabled
    requires_python: ">=3.14,<3.15"
  package_manager:
    name: uv
    version: 0.12.3
    role: external_bootstrap_tool_not_project_dependency
  build_backend:
    name: hatchling
    version: 1.32.0
  development_dependencies:
    - name: ruff
      version: 0.16.3
    - name: mypy
      version: 2.3.0
    - name: pytest
      version: 9.1.1
  project_runtime_direct_dependencies: []
  canonical_index: https://pypi.org/simple
  exclude_newer: "2026-08-13T23:59:59Z"
  prerelease_policy: DISALLOW

in_scope:
  - exact runtime pin taşıyan .python-version oluşturmak
  - yalnız local environment cache build ve editor artifacts için dar .gitignore oluşturmak
  - exact build ve dev dependency pinleriyle pyproject.toml oluşturmak
  - canonical PyPI ve sabit upload cutoff ile uv.lock dosyasını bir kez çözmek
  - lock graph'ını expected package markers source types ve wheel availability açısından incelemek
  - davranış içermeyen minimal src/cargoopt_recovery package shell oluşturmak
  - tek package import ve version smoke testi oluşturmak
  - foundation-only README local komutlarını belgelemek
  - local import format lint strict type test ve build smoke kapılarını çalıştırmak
  - dependency catalog tahminini observed lock graph ile güncellemek
  - Linux CPU local validation sonucunu compatibility matrix'e kaydetmek
  - tamamlanma durumunu task phase ve project status belgelerinde eşitlemek

out_of_scope:
  - PH1-T03 clean-room ikinci frozen sync CI security audit ve full license inventory
  - GitHub Actions veya başka CI workflow oluşturmak
  - coverage pre-commit Makefile task runner Docker veya container eklemek
  - CLI config logging environment loader plugin ya da code generator eklemek
  - BTS data cargo domain ML OR solver validator API database UI RAG LLM veya Hugging Face işi
  - Phase 2 ile Phase 8 için dependency path interface adapter TODO veya empty directory oluşturmak
  - toolchain sürümünü source index'i cutoff'u dependency grubunu veya kalite standardını değiştirmek
  - package publish etmek Git işlemi yapmak veya dış sisteme artifact göndermek

files_allowed_is_exact_allowlist: true
files_allowed:
  - .python-version
  - .gitignore
  - pyproject.toml
  - uv.lock
  - src/cargoopt_recovery/__init__.py
  - tests/test_package_import.py
  - README.md
  - PROJECT_SPEC.md
  - docs/phase-status.yaml
  - docs/tasks/PH1-T02.yaml
  - docs/foundation/DEPENDENCY_CATALOG.yaml
  - docs/foundation/COMPATIBILITY_MATRIX.md
  - docs/foundation/SCAFFOLD_FILE_PLAN.md

